<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0E13" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<title>촬영 원본 포맷 사전</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 컬러그레이딩 룸 — 카테고리 비율 컬러바 히어로 → 고정 컨트롤(분류·검색·확장자 레일) → 확장자 '릴' 카드 → 기종/코덱/Log/DIT 레퍼런스 */
:root{
  --bg:#F2F3F6; --bg-2:#E9EBF0; --surface:#FFFFFF; --ink:#12151C; --muted:#5D6574; --line:#DDE1E8; --line-2:#C8CED8;
  --accent:#C2581C; --accent-2:#1F6FA8; --glow:rgba(194,88,28,.16);
  --ok:#1E7A45; --ok-bg:#DDF3E4; --warn:#9A5A00; --warn-bg:#FFF0D6; --std-bg:#ECEEF3; --bad:#B4233C; --bad-bg:#FBDDE2;
  --c-cine:#C0504D; --c-ilc:#F79646; --c-drone:#4F81BD; --c-action:#9BBB59; --c-gimbal:#4BACC6;
  --c-vr:#8064A2; --c-phone:#C9A33E; --c-bcast:#A07850; --c-legacy:#8497B0; --c-rec:#C27BA0;
  --f-display:"Bricolage Grotesque","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px; --shadow:0 1px 2px rgba(18,21,28,.05),0 8px 24px -12px rgba(18,21,28,.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0E13; --bg-2:#11141B; --surface:#161A22; --ink:#ECEBE6; --muted:#9199A6; --line:#232935; --line-2:#323A48;
  --accent:#F2A36B; --accent-2:#7CC2EA; --glow:rgba(242,163,107,.14);
  --ok:#7FD69E; --ok-bg:#16301F; --warn:#F0BC67; --warn-bg:#33270F; --std-bg:#1E232D; --bad:#F59AAA; --bad-bg:#3A1A21;
  --c-cine:#C96B68; --c-ilc:#F8A662; --c-drone:#6994C7; --c-action:#AAC572; --c-gimbal:#66B8CF;
  --c-vr:#937BB0; --c-phone:#D1B05B; --c-bcast:#AE8C6A; --c-legacy:#96A7BC; --c-rec:#CB8FAE;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0E13; --bg-2:#11141B; --surface:#161A22; --ink:#ECEBE6; --muted:#9199A6; --line:#232935; --line-2:#323A48;
  --accent:#F2A36B; --accent-2:#7CC2EA; --glow:rgba(242,163,107,.14);
  --ok:#7FD69E; --ok-bg:#16301F; --warn:#F0BC67; --warn-bg:#33270F; --std-bg:#1E232D; --bad:#F59AAA; --bad-bg:#3A1A21;
  --c-cine:#C96B68; --c-ilc:#F8A662; --c-drone:#6994C7; --c-action:#AAC572; --c-gimbal:#66B8CF;
  --c-vr:#937BB0; --c-phone:#D1B05B; --c-bcast:#AE8C6A; --c-legacy:#96A7BC; --c-rec:#CB8FAE;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:var(--bar-h,210px)}
body{margin:0;padding-top:var(--tabs-h,64px);background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* HERO */
.hero{padding-block:40px 28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:-40% -10% auto auto;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 65%);pointer-events:none}
.tc{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.tc .tz{opacity:.7;letter-spacing:.06em}
.tc .rec{display:inline-flex;align-items:center;gap:7px;color:var(--accent)}
.tc .rec::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;animation:blink 1.6s steps(2,start) infinite}
@keyframes blink{50%{opacity:.2}}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,7vw,84px);line-height:1.3;letter-spacing:-.035em;margin:0;text-wrap:balance}
.htitle{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:20px}
.credit{display:flex;flex-direction:column;align-items:flex-end;gap:5px;margin-bottom:8px;opacity:.5;transition:opacity .3s;flex:none}
.credit:hover{opacity:.85}
.credit span{font-family:var(--f-mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.credit img{height:24px;width:auto;display:block}
.lg-w{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg-b{display:none!important}:root:not([data-theme="light"]) .lg-w{display:block!important}}
:root[data-theme="dark"] .lg-b{display:none!important}:root[data-theme="dark"] .lg-w{display:block!important}
@media (max-width:640px){.credit img{height:17px}.credit span{font-size:8px}.credit{margin-bottom:6px}}
h1 em{font-style:normal;background:linear-gradient(100deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{max-width:960px;color:var(--muted);font-size:16.5px;margin:18px 0 0}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:28px}
.stat b{display:block;font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.stats{gap:20px 40px}
.stat{padding-left:14px;border-left:2px solid var(--line-2)}
.stat b small{font-size:.5em;color:var(--muted);font-weight:500;margin-left:2px}
.stat em{display:block;font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-top:10px}
.stat span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.bars{margin-top:30px;display:flex;height:14px;border-radius:999px;overflow:hidden;gap:2px}
.bars i{display:block;height:100%;background:var(--cc);min-width:6px;transition:flex-grow .5s ease,opacity .35s ease}
.bars-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--muted)}
.bars-legend span{display:inline-flex;align-items:center;gap:6px}
.bars-legend span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--cc)}
.concepts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0 0;padding:0;list-style:none;counter-reset:ov}
.concept{counter-increment:ov;position:relative}
.concept h3::before{content:counter(ov);display:inline-grid;place-items:center;width:18px;height:18px;margin-right:7px;border-radius:50%;background:var(--accent);color:var(--bg);font:700 11px/1 var(--f-mono);vertical-align:1px}

:root[lang="en"] .concept code.dup{display:none}
:root[lang="ko"] body{word-break:keep-all;overflow-wrap:break-word}
:root[lang="ja"] body{word-break:auto-phrase}
.lede2{max-width:960px;text-wrap:pretty;color:var(--muted);font-size:14px;margin:8px 0 0}
.ov{margin-top:30px}
.ov-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.02em}
.ov-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
#pg-models .bars{margin-top:16px}
@media (max-width:640px){ .concepts{grid-template-columns:1fr 1fr;gap:8px} .concept{padding:12px 13px} .concept h3{font-size:13px} .concept h3 code{display:block;margin-top:2px;font-size:11px} .concept p{font-size:12.5px;line-height:1.5} }
.concept{padding:16px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);min-width:0}
.concept h3{margin:0 0 6px;font-size:14px;font-weight:700}
.concept h3 code{font-family:var(--f-mono);font-size:12.5px;color:var(--accent);font-weight:700}
.concept p{margin:0;font-size:13.5px;color:var(--muted);word-break:keep-all;overflow-wrap:anywhere}

/* PAGE TABS: 맨 위 고정 메뉴 */
.tabs{position:fixed;top:0;left:0;right:0;z-index:22;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 94%,transparent);border-bottom:1px solid var(--line)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .tabs{background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px)}
}
.tabs-in{padding-block:6px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:14px;white-space:nowrap;text-decoration:none}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.seg{flex:1;min-width:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;padding:3px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line)}
.seg a{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;padding:6px 6px;border-radius:11px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:color .25s,background .25s,box-shadow .25s,transform .15s}
.seg a svg{flex:none;width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.seg a .s{display:none}
.seg a span{min-width:0;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.seg a:hover{color:var(--ink)}
.seg a:active{transform:scale(.96)}
.seg a[aria-current="page"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.12),0 6px 16px -8px rgba(0,0,0,.35)}
.seg a[aria-current="page"]::after{content:"";position:absolute;left:50%;bottom:3px;width:16px;height:2px;margin-left:-8px;border-radius:2px;background:var(--accent)}
@media (max-width:820px){ .brand{display:none} }
@media (max-width:640px){
  .tabs-in{padding-block:4px}
  .seg{gap:2px;padding:2px;border-radius:11px}
  .seg a{flex-direction:column;gap:1px;padding:4px 2px 5px;border-radius:9px;font-size:9.5px;line-height:1.1;letter-spacing:-.02em}
  .seg a svg{width:14px;height:14px}
  .seg a .f{display:none}
  .seg a .s{display:inline}
  .seg a[aria-current="page"]::after{bottom:1px;width:12px;margin-left:-6px}
}
/* 언어 선택 */
.lang{position:relative;flex:none}
.lang-btn{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);color:var(--ink);font:inherit;font-size:12.5px;font-weight:700;letter-spacing:.04em;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .2s,border-color .2s}
.lang-btn:hover,.lang-btn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.lang-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.lang-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:30;min-width:160px;margin:0;padding:6px;list-style:none;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);box-shadow:0 18px 40px -16px rgba(0,0,0,.5);animation:pagein .18s ease}
.lang-menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:0;border-radius:9px;background:none;color:var(--ink);font:inherit;font-size:14px;text-align:left;cursor:pointer}
.lang-menu button:hover{background:var(--bg-2)}
.lang-menu button[aria-checked="true"]{color:var(--accent);font-weight:700}
.lang-menu button[aria-checked="true"]::after{content:"✓"}
@media (max-width:640px){
  .tabs-in{gap:6px}
  .lang-btn{flex-direction:column;justify-content:center;gap:1px;height:auto;padding:4px 6px 5px;min-width:38px;font-size:9px;border-radius:9px}
  .lang-btn svg{width:14px;height:14px}
}
:root[lang="ja"]{--f-body:"IBM Plex Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;--f-display:"Bricolage Grotesque","IBM Plex Sans JP","Hiragino Sans",system-ui,sans-serif}
:root[lang="zh-Hans"]{--f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;--f-display:"Bricolage Grotesque","Noto Sans SC","PingFang SC",system-ui,sans-serif}
:root[lang="en"]{--f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif}
:root[lang="ja"] .seg a,:root[lang="zh-Hans"] .seg a{letter-spacing:0}
:root[lang="ja"] h1 em,:root[lang="zh-Hans"] h1 em{white-space:nowrap}
:root[lang="ja"] h1{font-size:clamp(32px,6.6vw,84px)}
:root[lang="ja"] .lede,:root[lang="ja"] .desc{line-break:strict}

/* 페이지 전환 */
/* 페이지 전환 시 페이드·떠오름 없음 (깜빡임으로 보여 제거) */
@keyframes pagein{from{opacity:0}to{opacity:1}}
.page-solo{padding-block:28px 10px}
.page-solo .ref{border-top:0;padding-top:6px}
.tsearch{max-width:520px}

/* 기종별 찾기: 군집 → 브랜드 */
.hero-sub{padding-block:34px 18px}
.hero-sub::after{display:none}
.hero-sub .bars{margin-top:20px}
.mcl{margin-top:26px}
.mbar{margin:14px 0 4px;border-bottom:1px solid var(--line)}
.mbar .bar-in{padding-block:4px 14px;transform-origin:50% 0;will-change:transform,opacity}
.mbr{scroll-margin-top:calc(var(--tabs-h,64px) + 90px)}
.mcl-h{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-family:var(--f-display);font-size:20px;letter-spacing:-.01em}
.mcl-h i{width:10px;height:10px;border-radius:3px;background:var(--cc)}
.mcl-h small{margin-left:auto;font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted)}
.mbr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.mbr{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--cc);border-radius:var(--r);padding:12px 16px 6px;box-shadow:var(--shadow);min-width:0}
.mbr h4{margin:0 0 4px;font-size:15px;font-weight:700}
.mbr ul{list-style:none;margin:0;padding:0}
.mbr li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.mbr li:first-child{border-top:0}
.mbr li b{font-size:13.5px;font-weight:600}
.mbr li code{font-family:var(--f-mono);font-size:11.5px;font-weight:700;color:var(--accent);text-align:right}
.mbr li span{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
@media (max-width:640px){ .mbr-grid{grid-template-columns:1fr} .mbr li{grid-template-columns:1fr} .mbr li code{text-align:left} }
.none{max-width:1240px;margin:30px auto;text-align:center;color:var(--muted)}

/* 검색 결과: 찾은 글자 표시 + 카드 테두리 깜빡임 */
mark.hit{background:color-mix(in srgb,var(--accent) 24%,transparent);color:inherit;border-radius:3px;padding:0 1px;box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
mark.hit.blink{animation:hitblink 1.3s ease}
@keyframes hitblink{0%,36%,72%{background:var(--accent);color:#fff}18%,54%{background:color-mix(in srgb,var(--accent) 24%,transparent);color:inherit}}
.mbr,.tbl tbody tr{transition:border-color .5s,box-shadow .5s,background .5s}
.card.hitflash,.mbr.hitflash{border-color:var(--accent)!important;box-shadow:0 0 0 4px var(--glow),var(--shadow)!important;transition:border-color .2s,box-shadow .2s}
.tbl tbody tr.hitflash{background:color-mix(in srgb,var(--accent) 10%,transparent)}
@media (max-width:640px){.tbl tbody tr.hitflash{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 4px var(--glow),var(--shadow)}}

/* 하단 검색 바: 스크롤 중엔 작아지고, 멈추면 다시 커짐 */
.sb{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:24;width:min(560px,calc(100% - 32px));display:flex;align-items:center;gap:6px;padding:5px;border-radius:999px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line-2);box-shadow:0 10px 30px -10px rgba(0,0,0,.45);transform:translateX(-50%);transform-origin:50% 100%;transition:transform .45s cubic-bezier(.32,.72,0,1),width .45s cubic-bezier(.32,.72,0,1),opacity .3s}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){ .sb{background:color-mix(in srgb,var(--surface) 70%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px)} }
.sb-in{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding-left:12px}
.sb-in svg{flex:none;width:16px;height:16px;stroke:var(--muted)}
.sb-in input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:16px;color:var(--ink);padding:8px 0}
.sb-in input::-webkit-search-cancel-button{display:none}
.sb-go{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:9px 16px;background:var(--accent);color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px -4px var(--accent);transition:transform .15s,padding .45s cubic-bezier(.32,.72,0,1)}
.sb-go svg{width:16px;height:16px;stroke:currentColor}
.sb-go:active{transform:scale(.95)}
.sb-x{flex:none;border:0;background:var(--bg-2);color:var(--muted);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:12px}
.sb.min{transform:translateX(-50%) scale(.82);width:min(300px,calc(100% - 140px));opacity:.92}
.sb.min .sb-go span{display:none}
.sb.min .sb-go{padding:9px 11px}
body{padding-bottom:84px}
.top{bottom:calc(76px + env(safe-area-inset-bottom,0px))!important}

/* 페이지 좌우 넘김 */
.slide-l{animation:slidel .36s cubic-bezier(.2,.8,.2,1) both}
.slide-r{animation:slider .36s cubic-bezier(.2,.8,.2,1) both}
@keyframes slidel{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes slider{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
html{overscroll-behavior-x:none;overflow-x:hidden}
body{touch-action:pan-y pinch-zoom;overflow-x:clip}

/* CONTROL BAR */
.bar{position:relative;z-index:5;border-bottom:1px solid var(--line)}
.bar-in{padding-block:12px;display:grid;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 280px;min-width:0;position:relative}
.search input{width:100%;font:inherit;font-size:14.5px;padding:10px 14px 10px 38px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);transition:border-color .2s,box-shadow .2s}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:none;font:inherit;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;transition:background .25s,color .25s,border-color .25s,transform .15s}
.chip:hover{transform:translateY(-1px)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--cc,var(--ink))}
.chip small{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.rail{display:flex;gap:6px;flex-wrap:wrap;position:relative}
.tile{flex:none;font-family:var(--f-mono);font-size:12.5px;font-weight:700;text-decoration:none;padding:6px 11px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);transition:background .2s,color .2s,border-color .2s,font-size .3s,padding .3s;white-space:nowrap}
.tile.leaving{pointer-events:none;z-index:1}
.tile sup{font-size:9.5px;color:var(--muted);margin-left:3px;font-weight:500}
.tile:hover{border-color:var(--accent);color:var(--accent)}
.tile.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tile:focus:not(:focus-visible),.chip:focus:not(:focus-visible){outline:none}
.tile{-webkit-tap-highlight-color:transparent}.chip{-webkit-tap-highlight-color:transparent}
.tile.on sup{color:inherit}
.navlinks{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.navlinks a{text-decoration:none}
.navlinks a:hover{color:var(--accent)}

/* 미니 바: 큰 컨트롤이 화면 위로 사라지면 위에서 내려오는 작은 고정 바.
   본문 높이를 바꾸지 않으므로(레이아웃 이동 없음) iPhone 관성 스크롤에서도 끊기지 않습니다. */
.mini{position:fixed;top:var(--tabs-h,64px);left:0;right:0;z-index:20;background:color-mix(in srgb,var(--bg) 96%,transparent);border-bottom:1px solid var(--line);box-shadow:0 12px 28px -20px rgba(0,0,0,.55);transform-origin:50% 0;transform:translate3d(0,-6px,0) scale(1.14);opacity:0;visibility:hidden;transition:transform .5s cubic-bezier(.32,.72,0,1),opacity .3s ease,visibility 0s linear .5s;will-change:transform,opacity}
.mini.show{transform:none;opacity:1;visibility:visible;transition:transform .5s cubic-bezier(.32,.72,0,1),opacity .22s ease,visibility 0s}
/* 큰 컨트롤은 위로 올라가며 살짝 작아지고 흐려짐 (transform만 써서 레이아웃은 그대로) */
#bar .bar-in{transform-origin:50% 0;will-change:transform,opacity}
.mini .chips{padding-bottom:5px;border-bottom:1px solid var(--line)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .mini{background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px)}
}
.mini .bar-in{padding-block:8px;gap:6px}
.mini .search input{padding:6px 12px 6px 34px;font-size:13px;border-radius:10px}
.mini .search svg{left:12px;width:14px;height:14px}
.mini .chips,.mini .rail{gap:5px}
.mini .chip{font-size:11.5px;padding:4px 9px;gap:5px}
.mini .chip .dot{width:6px;height:6px}
.mini .chip small,.mini .tile sup{display:none}
.mini .tile{font-size:11px;padding:3px 7px;border-radius:7px}
@media (max-width:640px){
  .search input,.mini .search input{font-size:16px}  /* 16px 미만이면 iPhone이 입력 시 화면을 확대합니다 */
  .chip{font-size:12px;padding:5px 10px;gap:5px}
  .tile{font-size:11.5px;padding:4px 8px}
  .count{display:none}
  /* 폰 미니 바: 검색 빼고, 짧은 이름 + 색 점 + 아주 작은 버튼 */
  .mini .bar-in{padding-block:4px 5px;gap:4px}
  .mini .search{display:none}
  .mini .chips,.mini .rail{gap:3px}
  .mini .chips{padding-bottom:4px}
  .mini .chip{font-size:9.5px;line-height:1.25;padding:2px 6px 2px 5px;gap:3px;border-radius:6px}
  .mini .chip .dot{display:inline-block;width:5px;height:5px}
  .mini .chip[aria-pressed="true"] .dot{box-shadow:0 0 0 1.5px var(--bg)}
  .mini .chip .lf{display:none}
  .mini .chip .ls{display:inline}
  .mini .tile{font-size:9px;line-height:1.25;padding:2px 4px;border-radius:5px;letter-spacing:-.03em}
}
.chip .ls{display:none}

/* REELS */
main{padding-block:30px 40px}
.reel{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;padding-block:28px;border-top:1px solid var(--line)}
[hidden]{display:none!important}
.reel-head{position:sticky;top:calc(var(--bar-h,210px) + 14px);align-self:start;min-width:0}
.ext{font-family:var(--f-mono);font-weight:700;font-size:clamp(30px,3.6vw,44px);letter-spacing:-.03em;line-height:1;color:var(--ink);word-break:break-word}
.ext .dot{color:var(--accent)}
.cont{margin-top:10px;font-weight:600;font-size:13.5px}
.gnote{margin-top:8px;font-size:13px;color:var(--muted)}
.n{margin-top:12px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:9px;align-content:start;box-shadow:var(--shadow);min-width:0;transition:transform .25s ease,border-color .5s,box-shadow .5s}
.card:hover{transform:translateY(-2px);border-color:var(--line-2)}
.card.in{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:.001;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.reel.flash .card{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow),var(--shadow);transition:border-color .2s,box-shadow .2s}
.meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;color:color-mix(in srgb,var(--cc) 70%,var(--ink));background:color-mix(in srgb,var(--cc) 13%,transparent)}
.ver{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.ver.web{color:var(--ok);background:var(--ok-bg)}
.ver.std{color:var(--muted);background:var(--std-bg)}
.ver.chk{color:var(--warn);background:var(--warn-bg)}
.card h3{margin:0;font-size:16px;font-weight:700;line-height:1.35;text-wrap:balance}
.codec{font-family:var(--f-mono);font-size:12.5px;font-weight:500;color:var(--accent-2);line-height:1.5}
.spec{font-size:12.5px;color:var(--muted);padding:7px 10px;border-radius:9px;background:var(--bg-2)}
.desc{font-size:13.5px;margin:0}
.devs{display:flex;flex-wrap:wrap;gap:4px}
.devs span{font-size:11.5px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--ink)}
.src{font-size:12px;color:var(--muted);text-decoration:none;justify-self:start}
.src:hover{color:var(--accent)}
.empty{padding:60px 0;text-align:center;color:var(--muted)}

/* REFERENCE */
.ref{padding-block:40px 10px;border-top:1px solid var(--line);display:grid;gap:14px}
.ref-head{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap}
h2{font-family:var(--f-display);font-size:clamp(24px,3vw,32px);font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
.ref-head p{margin:0;color:var(--muted);font-size:13.5px;max-width:860px;text-wrap:pretty}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:11px 14px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
thead th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--bg-2)}
td.k{font-family:var(--f-mono);font-weight:700;color:var(--accent);white-space:nowrap}
td.b{font-weight:700}
td{min-width:110px}
tbody tr{transition:background .2s}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.v{display:inline-block;font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:7px;white-space:nowrap}
.v.del{color:var(--ok);background:var(--ok-bg)}
.v.keep{color:var(--warn);background:var(--warn-bg)}
.v.orig{color:var(--bad);background:var(--bad-bg)}
.v.na{color:var(--muted);background:var(--std-bg)}
th.dit{background:var(--ink);color:var(--bg)}
td.dit{background:color-mix(in srgb,var(--accent) 5%,transparent);border-left:2px solid var(--line-2);min-width:230px}
td.dit small{display:block;margin-top:5px;color:var(--muted);font-size:12px}
.rule{margin:0;padding:12px 16px;border-radius:12px;border:1px dashed var(--line-2);font-size:13px;color:var(--muted)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend b{color:var(--ink)}
.fbrand{margin-top:28px;padding-top:22px;border-top:1px solid var(--line);display:grid;gap:6px}
.fbrand .flogo img{height:22px;width:auto;opacity:.75;margin-bottom:6px}
.fbrand p{margin:0;font-size:12.5px}
.fbrand b{color:var(--ink);font-weight:600}
.fbrand .copy{font-family:var(--f-mono);font-size:11px;letter-spacing:.02em}
footer{padding-block:40px 60px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);margin-top:40px}
.top{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;width:46px;height:46px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center;opacity:0;transform:translateY(12px);transition:opacity .3s,transform .3s;pointer-events:none}
.top.show{opacity:1;transform:none;pointer-events:auto}
.top svg{width:18px;height:18px;stroke:currentColor}

@media (max-width:640px){
  .tbl{overflow:visible;background:none;border:0;box-shadow:none;border-radius:0}
  .tbl table,.tbl tbody{display:block}
  .tbl thead{display:none}
  .tbl tbody tr{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;padding:14px 16px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .tbl td{display:block;min-width:0;padding:0;border:0;white-space:normal;font-size:13px}
  .tbl td::before{content:attr(data-label);display:block;font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .tbl td:empty{display:none}
  .tbl td.wide,.tbl td.dit{grid-column:1/-1}
  .tbl td.dit{border-left:0;border-radius:10px;padding:10px 12px;min-width:0}
}
@media (max-width:820px){
  .reel{grid-template-columns:1fr;gap:14px}
  .reel-head{position:static}
  .cards{grid-template-columns:1fr}
  .hero{padding-block:36px 20px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}

ict.s":"Extensions","tab.codecs":"Codec Guide","tab.codecs.s":"Codecs","tab.models":"Brands","tab.models.s":"Brands","tab.logs":"Log Curves","tab.logs.s":"Log","tab.sidecar":"Sidecars · DIT","tab.sidecar.s":"DIT","lang.label":"Language","aria.cats":"Camera categories","aria.rail":"Jump to extension","hero.asof":"As of {d} · Web-verified edition","hero.only":"Digital camera originals only","hero.title":"Camera Original<br><em>Format Guide<\/em>","hero.credit":"Curated by","hero.creditTitle":"AlterPictures","hero.lede":"What file each camera leaves behind, and how to handle it — all in one place.","stat.ext":"Extensions you'll meet on set","stat.formats":"Codec · format combinations","stat.cameras":"From ARRI and RED to smartphones","stat.verified":"Checked against manufacturer sources","chip.all":"All","short.all":"All","short.cine":"Cinema","short.ilc":"Hybrid","short.drone":"Drone","short.action":"Action","short.gimbal":"Gimbal","short.vr":"360","short.phone":"Phone","short.bcast":"Bcast","short.legacy":"Legacy","short.rec":"Recorder","count":"{g} extensions · {n} formats","reel.n":"{n} formats","card.src":"Source","empty":"No matches. Try a shorter search term or set the category to “All”.","models.h":"Recording Formats by Camera","models.p":"Recording extensions and codecs for every camera, organized by category → brand → model. Pick a category to show only that group; tap a brand to jump straight to it.","models.count":"{b} brands · {n} lineups","codecs.h":"Codec Guide","codecs.p":"The same codec can live in several containers. Editing load comes down to the compression method.","codecs.th1":"Codec","codecs.th2":"Family · Developer","codecs.th3":"Compression","codecs.th4":"Bit depth · Chroma","codecs.th5":"Main use · Notes","codecs.th6":"Extensions","codecs.legend":"<span><b>Long GOP<\/b> Stores only the differences between frames → small files, heavy to edit<\/span><span><b>Intra<\/b> Every frame stands alone → large files, light to edit<\/span><span><b>RAW<\/b> Sensor data → ISO and WB adjustable in post<\/span>","logs.h":"Log Gammas · Gamuts by Manufacturer","logs.p":"Same codec, different Log curve: your LUT and CST settings change with it.","logs.th1":"Manufacturer","logs.th2":"Log gamma","logs.th3":"Gamut","logs.th4":"Notes","sidecar.h":"Sidecar Files Created During Recording","sidecar.p":"Assuming the camera originals have been offloaded to two checksum-verified backups, the sidecar files backed up alongside them are rated from a DIT's point of view in three tiers: <b>Safe to delete · Keep · Do not delete<\/b>. Each rating comes with the reason behind it.","sidecar.th1":"Extension","sidecar.th2":"Created by","sidecar.th3":"What it is","sidecar.th4":"Field tip","sidecar.th5":"DIT verdict","sidecar.rule":"<b>Criteria<\/b> · <span class=\"v del\">🗑 Safe to delete<\/span> means the file carries no metadata used by editorial, CG, VFX or DI and can be regenerated from the originals. Delete only after a dual backup verified by checksum (xxHash · MD5). If production or the insurer requires a full clone of every card, that requirement takes precedence.","dit.del":"🗑 Safe to delete","dit.keep":"Keep","dit.orig":"Original · Do not delete","dit.na":"N/A","none":"No results. Try a different name or codec.","search.ph":"Search","search.btn":"Search","search.clear":"Clear search","ph.dict":"Camera, codec, extension (FX3, Komodo, .braw)","ph.codecs":"Search codecs (ProRes, HEVC, APV)","ph.models":"Model, brand, codec (FX3, GoPro, N-RAW)","ph.logs":"Log, gamut (S-Log3, LogC4, V-Log)","ph.sidecar":"Search sidecars (.LRF, RED, XML)","top":"Back to top","foot.note":"As of {d} · “Web-verified” items were confirmed against primary sources such as manufacturer specs and manuals; “Industry standard” items are widely established knowledge; “Needs verification” items may vary by firmware or region. Analog media are not covered.","foot.made":"The Camera Original Format Guide was conceived and built by <b>AlterPictures<\/b>, drawing on hands-on camera and DIT experience.","foot.copy":"© {y} AlterPictures. All rights reserved. · The content and design of this page may not be copied or distributed without permission.","dict.h":"Extensions","dict.p":"Video codec, container, bit depth, typical cameras and verification status for each extension. Pick a camera category to show only its extensions; tap an extension to jump straight to that format.","aria.mcats":"Camera categories","aria.brands":"Jump to brand","hero.lede2":"From ARRI and RED cinema cameras to DSLRs and mirrorless, drones, action cams, gimbal cams, 360° cameras, smartphones and broadcast camcorders.<br>Recording formats, codecs, log curves and sidecar files, compiled from manufacturers' official documentation.","ov.h":"Overview","ov.p":"Every camera file can be read in four parts.","ov.fmt.h":"Recording format","ov.fmt.p":"The name of the recording mode you pick in the camera menu — a bundle of codec, bitrate and container. XAVC S = H.264 + MP4; XF-AVC = H.264 + MXF.","ov.codec.h":"Video codec","ov.codec.p":"How the picture is actually compressed. It sets image quality, file size and how heavy the footage is to edit. H.264, HEVC, ProRes, Blackmagic RAW, REDCODE.","ov.cont.h":"Container","ov.cont.p":"The wrapper that bundles video, audio, timecode and metadata into one file. MP4, QuickTime (MOV), MXF, MPEG-TS.","ov.ext.h":"Extension","ov.ext.p":"The tag at the end of the file name. It hints at the container but says nothing about the codec inside — the same .MOV can hold H.264 or ProRes."},"data":{"시네마":"Cinema","DSLR·미러리스":"DSLR · Mirrorless","드론":"Drone","액션캠":"Action Cam","짐벌캠":"Gimbal Cam","스마트폰":"Smartphone","방송·캠코더":"Broadcast · Camcorder","레거시 디지털":"Legacy Digital","외부 레코더":"External Recorder","웹 확인":"Web-verified","업계 표준":"Industry standard","확인 필요":"Needs verification","방송·시네마 업계 표준 컨테이너. UMID·타임코드·릴네임 등 메타데이터가 풍부하고 Avid 워크플로우와 바로 연결됩니다. OP1a는 영상+음성 한 파일, OP-Atom은 트랙별 개별 파일(Avid·P2).":"The broadcast and cinema industry-standard container. Rich metadata (UMID, timecode, reel name) and a direct path into Avid workflows. OP1a carries video and audio in one file; OP-Atom writes a separate file per track (Avid, P2).","소니 시네마라인·방송 캠코더 표준. 방송사 납품 규격으로도 널리 쓰입니다.":"Standard on Sony Cinema Line cameras and broadcast camcorders. Also widely used as a broadcast delivery spec.","10-bit 4:2:2 · 최대 8.6K(8K DCI 30p)":"10-bit 4:2:2 · up to 8.6K (8K DCI 30p)","X-OCN XT / ST / LT (RAW 계열)":"X-OCN XT / ST / LT (RAW-type)","16-bit 리니어 · 베이어 · S-Gamut3":"16-bit linear · Bayer · S-Gamut3","소니 하이엔드 RAW. ProRes급 용량에 RAW급 계조. OP1a MXF로 래핑. Venice 2는 XT·ST·LT 내부 기록, Burano는 X-OCN LT, Venice 1은 AXS-R7 레코더.":"Sony's high-end RAW: ProRes-class file sizes with RAW-class tonality, wrapped in OP1a MXF. Venice 2 records XT, ST and LT internally; Burano records X-OCN LT; Venice 1 needs the AXS-R7 recorder.","오랫동안 방송사 납품 표준. 지금도 뉴스·중계 송출 규격으로 쓰입니다.":"The broadcast delivery standard for years, and still used for news and live transmission.","PDW-700·F800(광디스크), PMW-400·500, PXW-X400, PXW-Z280(호환 모드)":"PDW-700·F800 (optical disc), PMW-400·500, PXW-X400, PXW-Z280 (compatibility mode)","시네마 EOS의 MXF 코덱. C50은 XF-AVC(MXF)와 XF-AVC S·XF-HEVC S(MP4)를 모두 지원하며 메인 포맷에 따라 프록시도 선택.":"Cinema EOS's MXF codec. The C50 supports both XF-AVC (MXF) and XF-AVC S · XF-HEVC S (MP4), with proxy options depending on the main format.","Canon XF Codec (구형)":"Canon XF Codec (legacy)","XDCAM HD422와 같은 계열의 방송 규격.":"A broadcast format from the same family as XDCAM HD422.","XF300·XF305, EOS C300(1세대)":"XF300·XF305, EOS C300 (1st gen)","P2 카드 기반 방송·시네마 포맷. CONTENTS 폴더 구조에 영상·음성 별도 MXF(OP-Atom). 구형 DVCPRO HD도 같은 구조.":"P2-card-based broadcast and cinema format. Video and audio are written as separate MXF files (OP-Atom) inside the CONTENTS folder structure. Legacy DVCPRO HD uses the same structure.","VariCam LT·35·Pure, AJ-PX·AJ-HPX 계열 P2 캠코더":"VariCam LT·35·Pure, AJ-PX·AJ-HPX series P2 camcorders","ARRIRAW (비압축 베이어 RAW)":"ARRIRAW (uncompressed Bayer RAW)","12/13-bit Log · LogC3 / LogC4 · AWG3 / AWG4 · Alexa 265는 6560×3100":"12/13-bit Log · LogC3 / LogC4 · AWG3 / AWG4 · Alexa 265 at 6560×3100","ARRI 최고 화질 원본. 메타데이터가 풍부한 MXF 컨테이너(SMPTE RDD 54·55). Codex HDE로 오프로드하면 MXF/HDE로 약 40% 작아지고 디코딩 시 원본과 비트 단위 동일.":"ARRI's highest-quality original. Metadata-rich MXF container (SMPTE RDD 54/55). Offloading with Codex HDE produces MXF/HDE files about 40% smaller that decode bit-for-bit identical to the original.","Mini LF(2019)부터 ProRes도 MXF로 래핑해 소리·영상·메타를 한 파일로 관리.":"From the Mini LF (2019) on, ProRes is also wrapped in MXF, keeping audio, video and metadata in a single file.","ARRI 신규 코덱. ARRIRAW보다 작고 ProRes보다 유연한 중간 지점. ARRI 공식 샘플 페이지 기준 ALEXA 35 Xtreme에서만 기록.":"ARRI's new codec: smaller than ARRIRAW, more flexible than ProRes. Per ARRI's official sample footage page, recorded only on the ALEXA 35 Xtreme.","ALEXA 35 Xtreme 전용":"ALEXA 35 Xtreme only","후지필름 첫 시네마 카메라. MXF와 MOV 모두 기록, 프록시는 H.264 또는 ProRes Proxy. 3D LUT 16개 저장.":"Fujifilm's first cinema camera. Records both MXF and MOV, with H.264 or ProRes Proxy proxies. Stores up to 16 3D LUTs.","DNxHD(HD 전용) / DNxHR LB·SQ·HQ·HQX·444":"DNxHD (HD only) / DNxHR LB·SQ·HQ·HQX·444","8/10/12-bit · 해상도 독립(DNxHR)":"8/10/12-bit · resolution-independent (DNxHR)","Avid Media Composer 네이티브. 방송국 인제스트·오프라인 편집 표준. MOV에도 담길 수 있습니다.":"Native to Avid Media Composer. The standard for broadcast ingest and offline editing. Can also be wrapped in MOV.","ISO BMFF의 원형. 타임코드 트랙·다중 오디오·ProRes 같은 전문 코덱을 담기 좋아 포스트 프로덕션의 사실상 표준입니다.":"The forerunner of ISO BMFF. Handles timecode tracks, multichannel audio and pro codecs such as ProRes, making it the de facto standard in post-production.","iPhone 고효율 / 가장 호환성 높음":"iPhone High Efficiency / Most Compatible","H.265 HEVC (기본) / H.264":"H.265 HEVC (default) / H.264","8/10-bit · Dolby Vision HDR(HLG 기반) · 최대 4K120":"8/10-bit · Dolby Vision HDR (HLG-based) · up to 4K120","iOS 11부터 HEVC가 기본. HDR을 켜면 Dolby Vision 10-bit. 4K120 Dolby Vision은 iPhone 16 Pro부터.":"HEVC has been the default since iOS 11. With HDR on, video is 10-bit Dolby Vision. 4K120 Dolby Vision arrived with the iPhone 16 Pro.","HEVC 또는 ProRes":"HEVC or ProRes","Log 촬영은 HEVC 또는 ProRes로 저장. iPhone 17 Pro부터 Apple Log 2.":"Log footage is saved as HEVC or ProRes. Apple Log 2 from the iPhone 17 Pro.","10-bit 4:2:2 · All-Intra · 4K30 약 6GB/분":"10-bit 4:2:2 · All-Intra · about 6 GB/min at 4K30","USB-C 외부 SSD 직접 기록(15 Pro~). 128GB 모델은 1080p로 제한.":"Records directly to an external USB-C SSD (15 Pro and later). 128 GB models are limited to 1080p.","12-bit 베이어 RAW":"12-bit Bayer RAW","스마트폰 최초의 ProRes RAW. Genlock 지원으로 멀티캠 동기화, Final Cut Camera 2.0에서 오픈게이트·Log 2 사용.":"The first ProRes RAW on a smartphone. Genlock support for multicam sync; open gate and Apple Log 2 via Final Cut Camera 2.0.","공간 비디오 (Spatial Video)":"Spatial Video","좌·우 2시점 스테레오":"Two-view (left/right) stereo","Apple Vision Pro에서 3D로 재생. 베이스 레이어는 일반 HEVC라 2D로도 재생됩니다.":"Plays back in 3D on Apple Vision Pro. The base layer is standard HEVC, so it also plays in 2D.","iPhone 15 Pro, iPhone 16·17 시리즈, Apple Vision Pro":"iPhone 15 Pro, iPhone 16·17 series, Apple Vision Pro","시네마틱 모드 · Live Photo":"Cinematic Mode · Live Photo","HEVC + 깊이 메타 / HEVC":"HEVC + depth metadata / HEVC","시네마틱: 최대 4K30 Dolby Vision":"Cinematic: up to 4K30 Dolby Vision","시네마틱 모드는 촬영 후 초점·심도 수정 가능(깊이 맵 포함). Live Photo는 .HEIC 사진 + 약 3초 .MOV 한 쌍.":"Cinematic mode lets you change focus and depth of field after the shot (depth map included). A Live Photo is a pair: a .HEIC still plus a roughly 3-second .MOV.","iPhone 13 이후(시네마틱), iPhone 6s 이후(Live Photo)":"iPhone 13 and later (Cinematic), iPhone 6s and later (Live Photo)","DJI Cine 드론 ProRes":"DJI Cine Drone ProRes","Cine 모델 전용 SSD에 ProRes 기록. 상업 공중촬영 표준. Mavic 4 Pro는 ProRes 미지원(MP4 전용).":"Cine models record ProRes to a dedicated SSD. The standard for commercial aerial work. The Mavic 4 Pro does not support ProRes (MP4 only).","DJI Zenmuse X9 계열":"DJI Zenmuse X9 Series","12-bit RAW · 최대 8K":"12-bit RAW · up to 8K","Ronin 4D 공식 사양: ProRes RAW HQ/RAW, ProRes 4444 XQ, 422 HQ/LT, H.264(4:2:0 10-bit). PROSSD·CFexpress·USB-C SSD 기록. Inspire 3는 같은 X9 센서에 CinemaDNG도 지원.":"Ronin 4D official specs: ProRes RAW HQ/RAW, ProRes 4444 XQ, 422 HQ/LT, H.264 (4:2:0 10-bit). Records to PROSSD, CFexpress or USB-C SSD. Inspire 3 uses the same X9 sensor and also supports CinemaDNG.","내부 ProRes RAW는 CFexpress Type B에만 기록(SD 불가). HDMI로 Atomos(ProRes RAW)·Blackmagic(BRAW) 외부 RAW 기록도 지원.":"Internal ProRes RAW records to CFexpress Type B only (not SD). External RAW over HDMI to Atomos (ProRes RAW) or Blackmagic (BRAW) is also supported.","X-H2S부터 내부 ProRes와 프록시 동시 기록. RAW는 HDMI로 Atomos(ProRes RAW)·Blackmagic(BRAW).":"From the X-H2S on, internal ProRes and proxies record simultaneously. RAW goes out over HDMI to Atomos (ProRes RAW) or Blackmagic (BRAW).","Canon DSLR (구형 EOS)":"Canon DSLR (legacy EOS)","DSLR 동영상 시대를 연 포맷. 5D Mark IV·1D X Mark II의 4K는 MJPEG라 용량이 매우 큽니다.":"The format that launched the DSLR video era. 4K on the 5D Mark IV and 1D X Mark II is MJPEG, so files are very large.","ARRI ProRes (구형 Alexa)":"ARRI ProRes (legacy Alexa)","Alexa가 ProRes를 영화 촬영 표준으로 만든 계기. 바로 편집 가능한 데일리.":"The Alexa is what made ProRes a feature-film acquisition standard: dailies ready to cut straight away.","10/12-bit · 최대 120fps(ProRes)":"10/12-bit · up to 120 fps (ProRes)","R3D 대신 바로 편집할 포맷. RED 공식 사양: V-Raptor [X]는 4444 XQ~422 LT 전용 기록. ProRes 클립도 .RDM/.RDC 폴더 구조로 저장.":"An edit-ready alternative to R3D. Per RED's official specs, V-Raptor [X] records 4444 XQ to 422 LT only. ProRes clips are also stored in the .RDM/.RDC folder structure.","X-OCN 대신 바로 편집할 포맷이 필요할 때.":"For when you need an edit-ready format instead of X-OCN.","BRAW 대신 즉시 편집용. PYXIS·URSA Cine 계열은 BRAW + H.264 프록시 중심이니 기종별 확인.":"An edit-ready alternative to BRAW. PYXIS and URSA Cine models are built around BRAW + H.264 proxies, so check per model.","보급형 시네마 박스캠. RAW는 별도 포맷(ZRAW 등).":"Entry-level cinema box cameras. RAW is a separate format (ZRAW, etc.).","외부 레코더 ProRes RAW":"External Recorder ProRes RAW","12-bit 베이어 RAW (HDMI·SDI RAW 입력)":"12-bit Bayer RAW (HDMI/SDI RAW input)","카메라의 RAW 출력을 레코더가 ProRes RAW로 기록. 미러리스로 RAW를 찍는 가장 흔한 방법.":"The recorder captures the camera's RAW output as ProRes RAW. The most common way to shoot RAW on mirrorless.","외부 레코더 ProRes / DNxHR":"External Recorder ProRes / DNxHR","ProRes 422 HQ 등 · Avid DNxHR":"ProRes 422 HQ etc. · Avid DNxHR","8-bit 내부 기록 카메라를 10-bit 인트라 코덱으로 끌어올리거나 백업 동시 기록.":"Upgrades cameras limited to 8-bit internal recording to a 10-bit intraframe codec, or records a simultaneous backup.","가장 범용적인 컨테이너. 스마트폰·액션캠·드론·미러리스 대부분의 기본값입니다. 재생 호환성은 최고지만 타임코드 트랙과 멀티 오디오는 MOV·MXF보다 제한적입니다.":"The most universal container and the default on most smartphones, action cams, drones and mirrorless cameras. Playback compatibility is unbeatable, but timecode tracks and multichannel audio are more limited than in MOV or MXF.","스마트폰 표준 (호환성 우선)":"Smartphone Standard (Compatibility First)","8-bit 4:2:0 · Long GOP · VFR(가변 프레임)":"8-bit 4:2:0 · Long GOP · VFR (variable frame rate)","갤럭시 '고효율 동영상' OFF 시 기본. 어디서나 재생됩니다. 스마트폰 영상은 대부분 VFR이라 편집 전 CFR 변환을 권장합니다.":"Default on Galaxy with 'High efficiency video' off. Plays anywhere. Most smartphone footage is VFR, so convert to CFR before editing.","Galaxy 전 기종, Google Pixel, Xiaomi, OPPO·vivo, Sony Xperia":"Galaxy (all models), Google Pixel, Xiaomi, OPPO·vivo, Sony Xperia","스마트폰 고효율 · HDR":"Smartphone High Efficiency · HDR","10-bit 4:2:0 · HDR10 / HDR10+ / HLG · 최대 8K":"10-bit 4:2:0 · HDR10 / HDR10+ / HLG · up to 8K","스마트폰 Log 촬영":"Smartphone Log","10-bit · 제조사 Log 감마":"10-bit · manufacturer Log gamma","삼성 공식 안내상 Galaxy Log 영상은 HEVC로 저장됩니다. Xiaomi Mi-Log, vivo·OPPO Log도 HEVC 기반. 제조사 LUT로 Rec.709 변환.":"Per Samsung's official guidance, Galaxy Log video is saved as HEVC. Xiaomi Mi-Log and vivo/OPPO Log are also HEVC-based. Use the manufacturer's LUT to convert to Rec.709.","삼성이 개발한 오픈소스 전문가용 코덱. 같은 화질에서 약 10% 더 효율적이고 재인코딩 열화가 적습니다. APV로 Log 촬영 가능, 외부 저장장치 직접 기록, 기기 내 APV→HEVC 변환 메뉴 제공. FFmpeg 호환. ※ 저장 컨테이너는 삼성 문서에 명시되지 않음.":"An open-source professional codec developed by Samsung. About 10% more efficient at the same quality, with less generation loss on re-encode. Supports Log recording, direct recording to external storage and an in-device APV→HEVC conversion menu. FFmpeg-compatible. ※ The container is not specified in Samsung's documentation.","H.265 (파일명 GX…) / H.264 (파일명 GH…)":"H.265 (filenames GX…) / H.264 (filenames GH…)","8/10-bit · 최대 5.3K · GP-Log · HLG":"8/10-bit · up to 5.3K · GP-Log · HLG","GPMF로 GPS·자이로·가속도 메타 내장 → Gyroflow 후보정 가능. 긴 영상은 GX01, GX02…로 챕터 분할. .LRV(프록시)와 .THM(썸네일)이 함께 생성됩니다.":"GPMF embeds GPS, gyro and accelerometer metadata → stabilization in post with Gyroflow. Long takes are chaptered as GX01, GX02… .LRV (proxy) and .THM (thumbnail) files are created alongside.","HERO 9~13 Black, HERO(2024), HERO11 Mini, MAX2(단렌즈 모드)":"HERO 9–13 Black, HERO (2024), HERO11 Mini, MAX2 (single-lens mode)","H.265 (일부 구형 H.264 병행)":"H.265 (some older models also H.264)","10-bit D-Log M · HLG · 최대 8K(Action 6) · 최대 120~130Mbps":"10-bit D-Log M · HLG · up to 8K (Action 6) · up to 120–130 Mbps","DJI 공식 비교표 기준 최신 기종은 MP4(HEVC). Action 6은 8K(16:9) 지원. .LRF 프록시 동시 생성, 자이로 메타 내장.":"Per DJI's official comparison chart, current models record MP4 (HEVC). Action 6 supports 8K (16:9). Creates .LRF proxies simultaneously; gyro metadata embedded.","Insta360 단렌즈 액션캠":"Insta360 Single-Lens Action Cams","8/10-bit · I-Log · 최대 8K30 · 최대 180Mbps(Ace Pro 2)":"8/10-bit · I-Log · up to 8K30 · up to 180 Mbps (Ace Pro 2)","GO Ultra·GO 3S·GO 3는 공식 매뉴얼상 모든 모드가 MP4이고, 일부 모드에서 미리보기용 .LRV를 함께 만듭니다.":"Per the official manuals, every mode on the GO Ultra, GO 3S and GO 3 records MP4, and some modes also create an .LRV preview file.","DJI 포켓 짐벌캠":"DJI Pocket Gimbal Cams","10-bit · D-Log M / HLG · 1인치 센서 · 4K":"10-bit · D-Log M / HLG · 1-inch sensor · 4K","1인치 센서 포켓 짐벌의 표준 포맷. .LRF 프록시 동시 생성. 브이로그부터 상업 B캠까지. ※ Pocket 4 계열 코덱 세부는 공식 사양표 확인 권장.":"The standard format for 1-inch-sensor pocket gimbals. Creates .LRF proxies simultaneously. Used for everything from vlogs to commercial B-camera work. ※ For Pocket 4 series codec details, check the official spec sheet.","Insta360 Luna 짐벌캠":"Insta360 Luna Gimbal Cams","10-bit · I-Log · Dolby Vision · 8K30 / 4K120 · 최대 120Mbps":"10-bit · I-Log · Dolby Vision · 8K30 / 4K120 · up to 120 Mbps","360° 스티칭 완료본":"360° Stitched Master","2:1 Equirectangular · 구형(Spherical) 메타데이터":"2:1 equirectangular · spherical metadata","카메라 내부 스티칭 또는 앱 내보내기 결과. YouTube·Meta에 바로 올라가는 범용 360 포맷. 5.7K 이상은 HEVC 권장. DJI Osmo 360·Avata 360의 일반(단렌즈) 영상도 MP4(HEVC).":"Output of in-camera stitching or an app export. The universal 360 format that uploads straight to YouTube and Meta. HEVC recommended at 5.7K and above. Standard (single-lens) video on the DJI Osmo 360 and Avata 360 is also MP4 (HEVC).","Ricoh THETA X·Z1, Insta360 X3~X5(내보내기), Kandao QooCam 3 Ultra, DJI Osmo 360·Avata 360(일반 영상)":"Ricoh THETA X·Z1, Insta360 X3–X5 (exports), Kandao QooCam 3 Ultra, DJI Osmo 360·Avata 360 (standard video)","프로 VR 리그 (렌즈별 원본)":"Pro VR Rig (Per-Lens Originals)","렌즈별 개별 파일 · 8K~12K · 3D 가능":"Separate file per lens · 8K–12K · 3D capable","렌즈마다 MP4를 따로 기록한 뒤 전용 스티처나 Mistika VR로 합성. Canon 듀얼 피쉬아이 렌즈는 한 파일에 좌·우 원형 이미지가 나란히 기록됩니다.":"Each lens records its own MP4, combined afterwards in a dedicated stitcher or Mistika VR. Canon dual fisheye lenses record the left and right circular images side by side in a single file.","Insta360 Pro 2·Titan, Kandao Obsidian, Canon RF 듀얼 피쉬아이(EOS R5·R5 C·R7)":"Insta360 Pro 2·Titan, Kandao Obsidian, Canon RF Dual Fisheye (EOS R5·R5 C·R7)","최대 6K60 · H.264 ALL-I 1200Mbps · H.265 180Mbps · H.264 90Mbps":"Up to 6K60 · H.264 ALL-I 1200 Mbps · H.265 180 Mbps · H.264 90 Mbps","공식 사양상 동영상은 MP4 전용이며 ProRes는 지원하지 않습니다. H.264 ALL-I는 512GB 크리에이터 콤보에서만 가능.":"Per official specs, video is MP4 only; ProRes is not supported. H.264 ALL-I is available only on the 512 GB Creator Combo.","DJI · Autel 드론 일반":"DJI · Autel Drones (General)","8/10-bit · D-Log / D-Log M / HLG · 최대 5.1K~6K":"8/10-bit · D-Log / D-Log M / HLG · up to 5.1K–6K","기종에 따라 MP4/MOV 선택. 비행 텔레메트리 .SRT와 프록시 .LRF가 함께 생성됩니다.":"MP4 or MOV selectable depending on the model. A flight telemetry .SRT and an .LRF proxy are created alongside.","8-bit 4:2:0 / 10-bit 4:2:2 · 4K 최대 200Mbps":"8-bit 4:2:0 / 10-bit 4:2:2 · up to 200 Mbps in 4K","소니 미러리스 기본 포맷. 용량과 호환성의 균형. 오디오는 LPCM.":"The default format on Sony mirrorless. A balance of file size and compatibility. Audio is LPCM.","XAVC S보다 고효율. 4:2:2 10-bit HEVC는 디코딩이 무거우니 편집 PC의 하드웨어 지원(Apple Silicon, Intel Quick Sync, RTX 50 계열)을 먼저 확인하세요.":"More efficient than XAVC S. 4:2:2 10-bit HEVC is heavy to decode, so first confirm hardware support on your edit system (Apple silicon, Intel Quick Sync, RTX 50 series).","모든 프레임이 I-프레임이라 타임라인 반응성이 가장 좋습니다. 대신 용량이 큽니다.":"Every frame is an I-frame, so timeline performance is the best of the family. The trade-off is file size.","캐논 미러리스와 시네마 EOS 공용 MP4 포맷. 타임코드·메타가 강화된 이름 규칙. R6 Mark III는 7K 오픈게이트 MP4(6912×4608, 29.97p)도 기록.":"MP4 format shared by Canon mirrorless and Cinema EOS, with a naming scheme that carries richer timecode and metadata. The R6 Mark III also records 7K open-gate MP4 (6912×4608, 29.97p).","Canon EOS R 일반 동영상 (구형 규칙)":"Canon EOS R Standard Video (Legacy Scheme)","XF 이름이 붙기 전 세대 캐논 미러리스의 일반 MP4.":"Standard MP4 on Canon mirrorless generations from before the XF naming.","EOS R6 Mark II, R3, R7, R8, R50, R10, R5(1세대)":"EOS R6 Mark II, R3, R7, R8, R50, R10, R5 (1st gen)","H.264 (Nikon은 8-bit) / H.265":"H.264 (8-bit on Nikon) / H.265","Nikon ZR 매뉴얼상 MP4는 H.264 8-bit·AAC 오디오의 호환용이고, 10-bit·RAW는 MOV/NEV/R3D 쪽입니다. Panasonic·Fujifilm도 고비트레이트·ALL-I·ProRes는 주로 MOV.":"Per the Nikon ZR manual, MP4 is the compatibility option (H.264 8-bit, AAC audio); 10-bit and RAW live in MOV/NEV/R3D. On Panasonic and Fujifilm, high-bitrate, ALL-I and ProRes recording is also mostly MOV.","SxS 카드 기반 구형 방송 캠코더. BPAV 폴더 구조째 보관해야 메타가 유지됩니다.":"Legacy SxS-card broadcast camcorders. Keep the entire BPAV folder structure to preserve metadata.","CinemaDNG (Adobe 공개 RAW · 프레임 시퀀스)":"CinemaDNG (Adobe open RAW · frame sequence)","비압축 / 무손실 / 손실(3:1·4:1)":"Uncompressed / lossless / lossy (3:1 · 4:1)","12/14-bit 베이어":"12/14-bit Bayer","프레임당 DNG 1장 + 오디오 .wav. 오픈 규격이지만 파일 수가 많고 용량이 커서 BRAW·ProRes RAW로 대체되는 추세.":"One DNG per frame plus a separate .wav for audio. An open standard, but the file count and data volume are high, so it is being replaced by BRAW and ProRes RAW.","DJI Inspire 3(X9), Inspire 2(X5S·X7), Sigma fp·fp L, Blackmagic 구형(BMCC 2.5K, Pocket 1세대, URSA Mini 4.6K, Micro Cinema), Kinefinity":"DJI Inspire 3 (X9), Inspire 2 (X5S·X7), Sigma fp·fp L, legacy Blackmagic (BMCC 2.5K, original Pocket, URSA Mini 4.6K, Micro Cinema), Kinefinity","REDCODE RAW · RED Digital Cinema (2024년 Nikon 인수)":"REDCODE RAW · RED Digital Cinema (acquired by Nikon in 2024)","R3D 기록 시 .RDM(매거진) → .RDC(클립) 폴더 안에 .R3D 파일과 썸네일 .rtn이 생성됩니다(RED 공식 문서). 웨이블릿 압축 RAW라 ISO·WB·LUT가 영상에 굽히지 않고 메타데이터로 저장됩니다(IPP2 · Log3G10 · REDWideGamutRGB).":"R3D recording creates .R3D files and .rtn thumbnails inside an .RDM (magazine) → .RDC (clip) folder structure (per RED's official documentation). Because it is wavelet-compressed RAW, ISO, WB and LUT are stored as metadata rather than baked into the image (IPP2 · Log3G10 · REDWideGamutRGB).","REDCODE RAW (DSMC3 세대)":"REDCODE RAW (DSMC3 Generation)","품질 프리셋 방식. RED 공식 사양: V-Raptor [X]는 8K 17:9에서 HQ~ELQ 최대 60fps, LQ·ELQ 최대 120fps. HQ는 VFX·최고 화질, ELQ는 장시간.":"Quality presets. Per RED's official specs, V-Raptor [X] at 8K 17:9 records HQ–ELQ up to 60 fps, and LQ/ELQ up to 120 fps. HQ for VFX and maximum quality, ELQ for long record times.","V-Raptor [X]·XL [X](글로벌 셔터), V-Raptor 8K VV·S35, V-Raptor XL, Komodo-X 6K, Komodo 6K":"V-Raptor [X]·XL [X] (global shutter), V-Raptor 8K VV·S35, V-Raptor XL, Komodo-X 6K, Komodo 6K","REDCODE RAW (DSMC2 · 구형)":"REDCODE RAW (DSMC2 · Legacy)","REDCODE 압축률 2:1 ~ 22:1":"REDCODE compression ratios 2:1 – 22:1","5:1, 8:1처럼 압축률로 화질·용량을 정하던 방식. 렌탈·아카이브 현장에서 여전히 많이 다룹니다.":"Quality and file size set by compression ratio, e.g. 5:1 or 8:1. Still handled constantly in rental houses and archives.","Log3G10 고정 · REDWideGamutRGB · 최대 6K/59.94p":"Log3G10 fixed · REDWideGamutRGB · up to 6K/59.94p","Nikon 미러리스에 들어간 R3D. 톤 모드 선택 없이 Log3G10 고정이며 RED 파이프라인 그대로 현상.":"R3D inside Nikon mirrorless. No tone-mode choice — Log3G10 is fixed — and it processes through the standard RED pipeline.","8-bit 4:2:0 · 최대 1080p60 28Mbps · AC-3 / LPCM":"8-bit 4:2:0 · up to 1080p60 28 Mbps · AC-3 / LPCM","카메라 안에서는 PRIVATE/AVCHD/BDMV/STREAM/*.MTS, PC·블루레이 복사본은 .M2TS. 폴더 구조째 가져와야 메타가 유지됩니다. 4K 이후 XAVC S·MP4로 대체.":"In camera the files sit at PRIVATE/AVCHD/BDMV/STREAM/*.MTS; PC and Blu-ray copies are .M2TS. Import the entire folder structure to preserve metadata. Replaced by XAVC S and MP4 in the 4K era.","DVD 캠코더":"DVD Camcorders","8cm DVD 디스크에 직접 기록. VIDEO_TS 폴더 구조.":"Records directly to 8 cm DVD discs. VIDEO_TS folder structure.","Sony DCR-DVD, Hitachi DZ, Canon DC 시리즈":"Sony DCR-DVD, Hitachi DZ, Canon DC series","DV 스트림 / AVI (Microsoft RIFF)":"DV stream / AVI (Microsoft RIFF)","DV (DCT 인트라)":"DV (DCT intraframe)","miniDV 테이프 디지털 기록. 캡처 시 .dv, .avi(Type 1/2) 또는 .mov로 저장.":"Digital recording on MiniDV tape. Captured as .dv, .avi (Type 1/2) or .mov.","SD ~ 720p · 인트라":"SD to 720p · intraframe","초기 디지털카메라·컴팩트카메라 동영상.":"Video on early digital stills and compact cameras.","Canon PowerShot, Nikon Coolpix·D90, Panasonic Lumix 구형 컴팩트":"Canon PowerShot, Nikon Coolpix·D90, older Panasonic Lumix compacts","카메라에서 디모자이크 일부를 미리 처리한 RAW. 단일 파일이라 CinemaDNG보다 관리가 쉽고 디코딩이 가볍습니다. 메타 수정은 .sidecar 파일에 비파괴로 저장되며, 3D LUT도 메타데이터로 담깁니다.":"RAW with part of the demosaic done in camera. A single file per clip, so it is easier to manage and lighter to decode than CinemaDNG. Metadata changes are saved non-destructively to a .sidecar file, and 3D LUTs can be embedded as metadata.","Blackmagic RAW (카메라 내부)":"Blackmagic RAW (In-Camera)","고정 비트레이트 3:1·5:1·8:1·12:1·18:1 / 고정 품질 Q0·Q1·Q3·Q5":"Constant bitrate 3:1 · 5:1 · 8:1 · 12:1 · 18:1 / constant quality Q0 · Q1 · Q3 · Q5","DaVinci Resolve와 최적 연동. PYXIS 12K 공식 사양상 코덱은 BRAW + H.264 프록시(1080p 8-bit 4:2:0) 동시 기록. CFexpress 2슬롯 + USB-C SSD.":"Tightest integration with DaVinci Resolve. Per the PYXIS 12K official specs, it records BRAW + H.264 proxy (1080p 8-bit 4:2:0) simultaneously. Dual CFexpress slots + USB-C SSD.","Blackmagic RAW (외부 기록)":"Blackmagic RAW (External)","12-bit RAW (HDMI·SDI RAW 입력)":"12-bit RAW (HDMI/SDI RAW input)","Blackmagic 공식: Video Assist 12G는 Leica, Panasonic, Fujifilm, Nikon, Canon, Sigma, Sony 카메라의 RAW 출력을 BRAW로 기록.":"Per Blackmagic: the Video Assist 12G records RAW output from Leica, Panasonic, Fujifilm, Nikon, Canon, Sigma and Sony cameras as BRAW.","Video Assist 12G HDR ← Panasonic S1H·S5II·S5IIX·S1II, Nikon Z6III·Z8·Z9, Fujifilm X-H2S·GFX100 II, Sigma fp, Leica SL2-S, Canon C300 Mark II 등":"Video Assist 12G HDR ← Panasonic S1H·S5II·S5IIX·S1II, Nikon Z6III·Z8·Z9, Fujifilm X-H2S·GFX100 II, Sigma fp, Leica SL2-S, Canon C300 Mark II and others","BRAW 스테레오 (한 파일에 2시점)":"BRAW stereo (two views in one file)","눈당 8160×7200 · 90fps · 16스톱":"8160×7200 per eye · 90 fps · 16 stops","Apple Immersive Video(Vision Pro 180°) 제작용. 듀얼 센서 영상을 단일 BRAW 파일에 기록, 8TB 미디어 모듈 내장.":"For Apple Immersive Video (Vision Pro 180°) production. Records both sensors to a single BRAW file; built-in 8 TB media module.","ARRIRAW 프레임 시퀀스 / Codex HDE 시퀀스":"ARRIRAW frame sequence / Codex HDE sequence","MXF 래핑 이전 세대의 ARRIRAW 저장 방식과, Codex HDE의 구형 프레임 시퀀스입니다.":"How ARRIRAW was stored before MXF wrapping, plus Codex HDE's legacy frame sequence.","ARRIRAW 시퀀스 (.ari)":"ARRIRAW Sequence (.ari)","ARRIRAW 비압축":"ARRIRAW uncompressed","12-bit Log 베이어 · LogC3":"12-bit Log Bayer · LogC3","프레임마다 파일 1개, 오디오는 별도 .wav. 구형 Alexa는 Codex 레코더로 기록.":"One file per frame, audio as a separate .wav. Legacy Alexas recorded it to Codex recorders.","Codex HDE 시퀀스 (.arx)":"Codex HDE Sequence (.arx)","ARRIRAW 무손실 인코딩":"ARRIRAW lossless encoding","ARRIRAW와 비트 단위 동일 · 약 40% 절감":"Bit-for-bit identical to ARRIRAW · about 40% smaller","ARRI 공식: Codex는 Mini LF까지의 카메라에 HDE를 프레임 단위 .arx 시퀀스로 만들었고, REVEAL 이후로는 MXF/HDE로 출력합니다. 지금 .arx는 구형 아카이브에서 주로 만납니다.":"Per ARRI: for cameras up to the Mini LF, Codex produced HDE as frame-based .arx sequences; since REVEAL it outputs MXF/HDE. Today you mostly meet .arx in older archives.","12-bit (일부 10-bit) · Canon Log 2/3 · Cinema Gamut":"12-bit (some 10-bit) · Canon Log 2/3 · Cinema Gamut","캐논 압축 RAW. 하이브리드 미러리스부터 시네마 EOS까지 공통. R6 Mark III는 7K RAW Light 최대 59.94p.":"Canon's compressed RAW, shared from hybrid mirrorless up to Cinema EOS. The R6 Mark III records 7K RAW Light at up to 59.94p.","Canon Cinema RAW (프레임 시퀀스)":"Canon Cinema RAW (frame sequence)","비압축 RAW":"Uncompressed RAW","10/12-bit 베이어":"10/12-bit Bayer","클립 폴더 안에 프레임별 .RMF. 외부 Codex 레코더와 조합하던 구형 하이엔드 RAW.":"One .RMF per frame inside the clip folder. Legacy high-end RAW recorded in combination with an external Codex recorder.","EOS C700·C700 FF(Codex CDX-36150), EOS C500(1세대, 외부 레코더)":"EOS C700·C700 FF (Codex CDX-36150), EOS C500 (1st gen, external recorder)","Cine RAW(비압축 베이어) · Cine(디베이어 RGB)":"Cine RAW (uncompressed Bayer) · Cine (debayered RGB)","12-bit · 1,000 ~ 수만 fps":"12-bit · 1,000 to tens of thousands of fps","초고속 촬영 전용. Cine RAW는 설정을 메타로 보존, Cine는 색 보간이 된 버전. PCC·Resolve에서 처리.":"Dedicated to high-speed cinematography. Cine RAW keeps settings as metadata; Cine is the debayered (color-interpolated) version. Process in PCC or Resolve.","Phantom Flex4K, VEO 4K 990·590, TMX 시리즈":"Phantom Flex4K, VEO 4K 990·590, TMX series","ZRAW (부분 디베이어 RAW)":"ZRAW (partially debayered RAW)","2019년 E2 펌웨어 0.88에서 추가된 Z CAM 전용 RAW. Resolve 플러그인 또는 변환 툴 필요. 펌웨어별 지원 변경 이력이 있어 현장 전 확인 권장.":"Z CAM's proprietary RAW, added in E2 firmware 0.88 (2019). Requires a Resolve plugin or a conversion tool. Support has changed between firmware versions, so verify before the shoot.","VariCam 35와 Codex V-RAW 레코더 조합에서 생성. 현재는 드물게 사용합니다.":"Created by the VariCam 35 paired with the Codex V-RAW recorder. Rarely used today.","YCbCr 기반 RAW · SDR / N-Log · LPCM 오디오":"YCbCr-based RAW · SDR / N-Log · LPCM audio","Nikon ZR 매뉴얼상 고성능 컴퓨터에서 RAW 현상을 전제로 한 포맷. 카메라 재생용 1920×1080 영상을 함께 보관.":"Per the Nikon ZR manual, a format intended for RAW processing on a high-performance computer. A 1920×1080 file for in-camera playback is stored alongside.","Magic Lantern Video (서드파티 펌웨어)":"Magic Lantern Video (third-party firmware)","10/12/14-bit 베이어":"10/12/14-bit Bayer","캐논 DSLR용 비공식 펌웨어 RAW. MLV App 등으로 CinemaDNG·ProRes로 변환해 사용.":"RAW from unofficial firmware for Canon DSLRs. Converted to CinemaDNG or ProRes with tools such as MLV App.","Insta360 전용 (MP4 기반 · 듀얼 피쉬아이)":"Insta360 proprietary (MP4-based · dual fisheye)","Insta360 360° 원본":"Insta360 360° Original","H.264 / H.265 (렌즈별 2스트림)":"H.264 / H.265 (two streams, one per lens)","최대 8K · I-Log · 자이로 메타 내장":"Up to 8K · I-Log · embedded gyro metadata","스티칭 전 원본 + FlowState 안정화용 자이로 데이터. Insta360 Studio·앱·Premiere 플러그인에서 리프레이밍 후 MP4로 내보냅니다. 사진은 .INSP, 미리보기는 .LRV.":"Unstitched original plus gyro data for FlowState stabilization. Reframe in Insta360 Studio, the app or the Premiere plugin, then export to MP4. Stills are .INSP; previews are .LRV.","Antigravity 360 드론":"Antigravity 360 Drone","INSV (앱·Studio에서 내보내기)":"INSV (export from app or Studio)","Insta360 계열 브랜드의 360° 드론. 영상 INSV, 사진 INSP로 기록하고 전용 앱/Studio에서 내보냅니다.":"A 360° drone from an Insta360-affiliated brand. Records video as INSV and stills as INSP; export from the dedicated app or Studio.","GoPro 360 (MP4 기반)":"GoPro 360 (MP4-based)","GoPro 360° 원본":"GoPro 360° Original","HEVC (2스트림)":"HEVC (two streams)","EAC(Equi-Angular Cubemap) 배치 · GPMF · 12GB 단위 챕터":"EAC (Equi-Angular Cubemap) layout · GPMF · 12 GB chapters","GoPro 공식: MAX2의 모든 영상은 HEVC, 360 영상은 GS로 시작하는 .360, 단렌즈 영상은 GX로 시작하는 .mp4. .lrv·.thm도 함께 생성. GoPro Player는 Apple APMP 내보내기 지원.":"Per GoPro: all MAX2 video is HEVC; 360 video is .360 with filenames starting GS, single-lens video is .mp4 starting GX. .lrv and .thm files are created alongside. GoPro Player supports Apple APMP export.","DJI 360 전용 (MP4 기반)":"DJI 360 proprietary (MP4-based)","DJI 360° 원본":"DJI 360° Original","H.265 (듀얼 스트림)":"H.265 (dual stream)","DJI 공식: 파노라마는 OSV, 일반 영상은 MP4(HEVC). DJI Studio·Mimo에서 스티칭·리프레이밍 후 MP4로 내보내고, Premiere는 플러그인으로 편집.":"Per DJI: panoramic video is OSV, standard video is MP4 (HEVC). Stitch and reframe in DJI Studio or Mimo, then export to MP4; edit in Premiere via plugin.","휴대폰 저해상도 영상":"Low-Res Mobile Phone Video","H.263 / MPEG-4 Part 2 / H.264 · AMR 오디오":"H.263 / MPEG-4 Part 2 / H.264 · AMR audio","애니콜·싸이언·SKY 피처폰, 초기 스마트폰 MMS 영상":"Anycall·Cyon·SKY feature phones, early smartphone MMS video","HDV (MPEG-2 TS · DV 테이프)":"HDV (MPEG-2 TS · DV tape)","miniDV 테이프에 디지털 HD 기록. 캡처하면 .M2T가 생성됩니다.":"Digital HD recording on MiniDV tape. Capturing produces .M2T files.","SD·HDD 캠코더 MPEG-2":"SD/HDD Camcorder MPEG-2","JVC·Panasonic 메모리 캠코더 초기 포맷. 확장자를 .MPG로 바꾸면 재생되는 경우가 많습니다.":"An early format on JVC and Panasonic memory camcorders. Renaming the extension to .MPG often makes it play.","JVC Everio, Panasonic SDR 계열":"JVC Everio, Panasonic SDR series","호환성 최고. 스마트폰·미러리스·방송까지 가장 넓게 쓰입니다.":"Best compatibility. The most widely used codec, from smartphones and mirrorless to broadcast.","HEVC 멀티뷰 확장":"HEVC multiview extension","Long GOP · 2시점":"Long GOP · two views","Apple 공간 비디오. Vision Pro 3D 재생.":"Apple Spatial Video. 3D playback on Vision Pro.","Samsung (오픈소스)":"Samsung (open source)","10-bit 4:2:2 (444 UQ는 4:4:4)":"10-bit 4:2:2 (4:4:4 for 444 UQ)","AOMedia (로열티 프리)":"AOMedia (royalty-free)","촬영보다는 배포용(YouTube·Netflix). 촬영 원본 코덱으로는 드뭅니다.":"A distribution codec (YouTube, Netflix) rather than an acquisition codec. Rare as a camera original codec.","(배포용)":"(distribution)","Apple ProRes 422 계열":"Apple ProRes 422 Family","Proxy(약 45Mbps) · LT(102) · 422(147) dobe (open)","프레임별 DNG RAW":"Per-frame DNG RAW","오픈 규격. 파일 수가 많습니다.":"Open standard. Very high file count.",".dng 시퀀스":".dng sequence","압축 RAW":"Compressed RAW","제조사 전용 RAW":"Manufacturer-proprietary RAW","특정 기종 전용 RAW.":"RAW specific to particular cameras.","S-Log3 (S-Log2 구형)":"S-Log3 (S-Log2 legacy)","S-Cinetone은 Log가 아닌 완성형 룩. FX·α·Venice·Burano 공통.":"S-Cinetone is a finished look, not Log. Common to FX, α, Venice and Burano.","LogC4·AWG4는 Alexa 35·35 Xtreme·265(REVEAL). LogC3는 그 이전 Alexa.":"LogC4 · AWG4 on Alexa 35 · 35 Xtreme · 265 (REVEAL). LogC3 on earlier Alexas.","IPP2 파이프라인. Nikon ZR의 R3D NE도 Log3G10 고정.":"IPP2 pipeline. R3D NE on the Nikon ZR is also fixed to Log3G10.","Log 2는 계조 우선, Log 3는 노이즈·편의성 우선.":"Log 2 prioritizes tonal range; Log 3 prioritizes lower noise and ease of use.","V-Log / V-Log L(구형 GH)":"V-Log / V-Log L (older GH)","F-Log2 C는 GFX ETERNA 등 확장 색역용. ETERNA는 F-Log2 기준 14스톱 이상.":"F-Log2 C is for the wider gamut on the GFX ETERNA and others. ETERNA delivers 14+ stops in F-Log2.","Rec.2020 기반":"Rec.2020-based","N-RAW·ProRes RAW·H.265 10-bit에서 선택.":"Selectable in N-RAW, ProRes RAW and H.265 10-bit.","DaVinci Resolve CST에서 바로 선택.":"Selectable directly in the DaVinci Resolve CST.","D-Log M은 Pocket·Action·Mini·Air·Osmo 360·Avata 360 등 소형 기기용.":"D-Log M is for compact devices such as Pocket, Action, Mini, Air, Osmo 360 and Avata 360.","iPhone 15 Pro 이후, Log 2는 iPhone 17 Pro부터.":"iPhone 15 Pro and later; Log 2 from the iPhone 17 Pro.","Rec.2020 계열":"Rec.2020-family","Galaxy S25 Ultra 이후. S26 Ultra는 APV로도 Log 기록.":"Galaxy S25 Ultra and later. The S26 Ultra can also record Log in APV.","제조사 지정":"Manufacturer-defined","Xiaomi 공식 LUT·ACES 변환 제공(17 Ultra 등).":"Official Xiaomi LUTs and ACES transforms available (17 Ultra, etc.).","전용 LUT 제공. Insta360 Luna·Ace Pro 2도 10-bit I-Log.":"Dedicated LUTs provided. Insta360 Luna and Ace Pro 2 also shoot 10-bit I-Log.","각사 공식 LUT 사용.":"Use each manufacturer's official LUTs.","저해상도 프록시 (실체는 MP4)":"Low-res proxy (actually an MP4)","확장자를 .mp4로 바꾸면 편집 프록시로 사용 가능. 앱 미리보기에 쓰입니다.":"Rename the extension to .mp4 to use it as an editing proxy. Used for in-app previews.","원본에서 다시 만들 수 있는 미리보기. 타임코드·메타 없음. 지우면 GoPro Quik·Insta360 앱 미리보기만 느려집니다.":"A preview that can be regenerated from the original. No timecode or metadata. Deleting it only slows previews in the GoPro Quik and Insta360 apps.","DJI 드론·Osmo Action·Pocket":"DJI drones · Osmo Action · Pocket","LRV와 같은 용도. 앱 미리보기용.":"Same purpose as LRV. For in-app previews.","GoPro, Canon 구형":"GoPro, older Canon","썸네일 이미지":"Thumbnail image","GoPro 공식: 영상 썸네일 표시용.":"Per GoPro: used to display video thumbnails.","썸네일일 뿐 메타데이터가 아닙니다.":"Just a thumbnail, not metadata.","썸네일 (RED Thumbnail)":"Thumbnail (RED Thumbnail)","RED 공식 문서상 .RDC 폴더 안에 R3D와 함께 생성.":"Per RED documentation, created alongside the R3D inside the .RDC folder.","클립 썸네일. R3D 메타·룩 정보는 R3D와 .RMD에 있습니다.":"Clip thumbnail. R3D metadata and look information live in the R3D and the .RMD.","DJI 드론":"DJI drones","비행 텔레메트리 자막 (GPS·고도·ISO·셔터)":"Flight telemetry subtitles (GPS · altitude · ISO · shutter)","촬영 위치·노출 확인용.":"For checking shooting location and exposure.","클립 메타데이터 (예: C0001M01.XML)":"Clip metadata (e.g. C0001M01.XML)","LUT·타임코드·자이로 정보 포함. Catalyst Browse 손떨림 보정에 필요.":"Contains LUT, timecode and gyro data. Required for stabilization in Catalyst Browse.","컬러·룩 메타데이터":"Color and look metadata","R3D와 같은 폴더에 유지.":"Keep in the same folder as the R3D.","현장 룩(ISO·WB·LUT). DI에서 촬영 의도 재현에 필요.":"The on-set look (ISO · WB · LUT). Needed in DI to reproduce the intended image.","BRAW 메타 오버라이드":"BRAW metadata override","Resolve에서 수정한 ISO·WB가 저장됩니다.":"Stores ISO and WB changes made in Resolve.","현장·DIT에서 바꾼 RAW 설정 기록. DI에 전달.":"Records RAW settings changed on set or by the DIT. Passed on to DI.","ARRI 등":"ARRI and others","편집실·DIT 메타데이터 전달.":"Hands metadata from the DIT to editorial.","편집 인제스트·컨폼용 클립 메타.":"Clip metadata for editorial ingest and conform.","REVEAL 세대의 현장 룩 파일.":"The on-set look file for the REVEAL generation.","현장에서 본 룩을 DI가 그대로 재현하는 데 필요.":"Needed for DI to reproduce exactly the look seen on set.","시네마 카메라 · 동시녹음기":"Cinema cameras · sound recorders","타임코드 포함 오디오":"Audio with timecode","CinemaDNG·ARRIRAW 시퀀스는 오디오가 별도 파일.":"CinemaDNG and ARRIRAW sequences record audio as separate files.","메타데이터가 아니라 실제 오디오 원본. 절대 삭제 금지.":"Not metadata — this is the actual original audio. Never delete.","AVCHD 카메라":"AVCHD cameras","AVCHD 클립·플레이리스트 정보":"AVCHD clip and playlist information","PRIVATE 폴더째 백업해야 날짜·분할 클립 연결 정보가 유지됩니다.":"Back up the entire PRIVATE folder to keep dates and spanned-clip links intact.","촬영 날짜·분할 클립 연결 정보. 지우면 긴 클립이 끊기거나 날짜가 사라집니다.":"Recording dates and spanned-clip links. Delete them and long clips break apart or lose their dates.","360° 사진":"360° still","동영상 아님. .INSV와 구분.":"Not video. Don't confuse it with .INSV.","Galaxy (JPEG/HEIC 내장)":"Galaxy (embedded in JPEG/HEIC)","사진 속 짧은 MP4 스트림":"Short MP4 stream inside a photo","Live Photo(.HEIC + .MOV)와 달리 한 파일에 내장.":"Unlike a Live Photo (.HEIC + .MOV), it is embedded in a single file.","별도 파일이 아니라 사진 안에 들어 있어 따로 지울 대상이 없습니다.":"It lives inside the photo rather than as a separate file, so there is nothing to delete.","GPMF · 자이로 메타":"GPMF · gyro metadata","GoPro, Sony, DJI, Insta360 (파일 내장)":"GoPro, Sony, DJI, Insta360 (embedded in file)","자이로·가속도 센서 데이터":"Gyro and accelerometer sensor data","Gyroflow·Catalyst Browse 손떨림 후보정에 사용.":"Used for stabilization in post with Gyroflow or Catalyst Browse.","영상 파일 안에 들어 있습니다. 트랜스코딩하면 사라지니 원본 파일은 그대로 보관.":"Lives inside the video file and is lost on transcode, so keep the original files untouched.","REDCODE 압축률 2:1~22:1 · ProRes · DNxHR":"REDCODE ratios 2:1–22:1 · ProRes · DNxHR","XAVC-I · ProRes · X-OCN(AXS-R7 레코더)":"XAVC-I · ProRes · X-OCN (AXS-R7 recorder)",".BRAW (+H.264 프록시)":".BRAW (+H.264 proxy)","AVC-Intra · AVC-Ultra · V-RAW(외부)":"AVC-Intra · AVC-Ultra · V-RAW (external)","AVC-Intra · AVC-LongG · H.264 · RAW(외부)":"AVC-Intra · AVC-LongG · H.264

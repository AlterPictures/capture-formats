る内容、「要確認」はファームウェアや地域によって異なる可能性がある項目です。アナログ媒体は対象外です。","foot.made":"撮影素材フォーマット辞典は、<b>AlterPictures<\/b>が撮影・DITの現場経験をもとに企画・制作しました。","foot.copy":"© {y} AlterPictures. All rights reserved. · 本ページの内容およびデザインの無断複製・転載を禁じます。","dict.h":"拡張子","dict.p":"拡張子ごとに、Video Codec・Container・ビット深度・代表機種・検証状況をまとめました。カメラ分類を選ぶと該当する拡張子だけが残り、拡張子をタップするとそのフォーマットへ直接移動します。","aria.mcats":"カメラカテゴリー","aria.brands":"ブランドへ移動","hero.lede2":"ARRI・REDのシネマカメラから、一眼レフ・ミラーレス、ドローン、アクションカム、ジンバルカメラ、360°カメラ、スマートフォン、放送用カムコーダーまで。<br>記録フォーマットとコーデック、Logガンマ、サイドカーファイルをメーカー公式資料に基づいて整理しました。","ov.h":"概要","ov.p":"カメラが残したファイルは、この4つの要素で読み解けます。","ov.fmt.h":"記録フォーマット","ov.fmt.p":"カメラのメニューで選ぶ記録方式の名称。コーデック・ビットレート・コンテナをひとまとめにした呼び名です。XAVC S = H.264 + MP4、XF-AVC = H.264 + MXF。","ov.codec.h":"コーデック","ov.codec.p":"映像を実際に圧縮する方式。画質・容量・編集負荷はここで決まります。H.264、HEVC、ProRes、Blackmagic RAW、REDCODE。","ov.cont.h":"コンテナ","ov.cont.p":"映像・音声・タイムコード・メタデータを1つのファイルにまとめる器。MP4、QuickTime（MOV）、MXF、MPEG-TS。","ov.ext.h":"拡張子","ov.ext.p":"ファイル名の末尾に付く名札。コンテナの見当はつきますが、中身のコーデックまではわかりません。同じ.MOVでも、H.264の場合もあればProResの場合もあります。"},"data":{"시네마":"シネマ","DSLR·미러리스":"一眼レフ・ミラーレス","드론":"ドローン","액션캠":"アクションカム","짐벌캠":"ジンバルカメラ","스마트폰":"スマートフォン","방송·캠코더":"放送用・業務用カムコーダー","레거시 디지털":"レガシーデジタル","외부 레코더":"外部レコーダー","웹 확인":"Web確認","업계 표준":"業界標準","확인 필요":"要確認","방송·시네마 업계 표준 컨테이너. UMID·타임코드·릴네임 등 메타데이터가 풍부하고 Avid 워크플로우와 바로 연결됩니다. OP1a는 영상+음성 한 파일, OP-Atom은 트랙별 개별 파일(Avid·P2).":"放送・シネマ業界の標準コンテナ。UMID・タイムコード・リール名などのメタデータが豊富で、Avidワークフローにそのまま連携できます。OP1aは映像＋音声を1ファイルに、OP-Atomはトラックごとに個別ファイル（Avid・P2）。","소니 시네마라인·방송 캠코더 표준. 방송사 납품 규격으로도 널리 쓰입니다.":"ソニーCinema Line・放送用カムコーダーの標準。放送局の納品フォーマットとしても広く使われています。","10-bit 4:2:2 · 최대 8.6K(8K DCI 30p)":"10-bit 4:2:2 · 最大8.6K（8K DCI 30p）","X-OCN XT / ST / LT (RAW 계열)":"X-OCN XT / ST / LT（RAW系）","16-bit 리니어 · 베이어 · S-Gamut3":"16-bit リニア · ベイヤー · S-Gamut3","소니 하이엔드 RAW. ProRes급 용량에 RAW급 계조. OP1a MXF로 래핑. Venice 2는 XT·ST·LT 내부 기록, Burano는 X-OCN LT, Venice 1은 AXS-R7 레코더.":"ソニーのハイエンドRAW。ProRes並みの容量でRAW並みの階調。OP1a MXFでラッピング。Venice 2はXT・ST・LTを内部収録、BuranoはX-OCN LT、Venice 1はAXS-R7レコーダーで収録。","오랫동안 방송사 납품 표준. 지금도 뉴스·중계 송출 규격으로 쓰입니다.":"長年にわたる放送局納品の標準。現在もニュース・中継の送出フォーマットとして使われています。","PDW-700·F800(광디스크), PMW-400·500, PXW-X400, PXW-Z280(호환 모드)":"PDW-700·F800（光ディスク）, PMW-400·500, PXW-X400, PXW-Z280（互換モード）","시네마 EOS의 MXF 코덱. C50은 XF-AVC(MXF)와 XF-AVC S·XF-HEVC S(MP4)를 모두 지원하며 메인 포맷에 따라 프록시도 선택.":"CINEMA EOSのMXFコーデック。C50はXF-AVC（MXF）とXF-AVC S・XF-HEVC S（MP4）の両方に対応し、メインフォーマットに応じてプロキシも選択可能。","Canon XF Codec (구형)":"Canon XF Codec（旧型）","XDCAM HD422와 같은 계열의 방송 규격.":"XDCAM HD422と同系統の放送規格。","XF300·XF305, EOS C300(1세대)":"XF300·XF305, EOS C300（初代）","P2 카드 기반 방송·시네마 포맷. CONTENTS 폴더 구조에 영상·음성 별도 MXF(OP-Atom). 구형 DVCPRO HD도 같은 구조.":"P2カードベースの放送・シネマフォーマット。CONTENTSフォルダ構造に映像・音声を別々のMXF（OP-Atom）で記録。旧型DVCPRO HDも同じ構造。","VariCam LT·35·Pure, AJ-PX·AJ-HPX 계열 P2 캠코더":"VariCam LT·35·Pure, AJ-PX·AJ-HPX系 P2カムコーダー","ARRIRAW (비압축 베이어 RAW)":"ARRIRAW（非圧縮ベイヤーRAW）","12/13-bit Log · LogC3 / LogC4 · AWG3 / AWG4 · Alexa 265는 6560×3100":"12/13-bit Log · LogC3 / LogC4 · AWG3 / AWG4 · Alexa 265は6560×3100","ARRI 최고 화질 원본. 메타데이터가 풍부한 MXF 컨테이너(SMPTE RDD 54·55). Codex HDE로 오프로드하면 MXF/HDE로 약 40% 작아지고 디코딩 시 원본과 비트 단위 동일.":"ARRIの最高画質オリジナル。メタデータが豊富なMXFコンテナ（SMPTE RDD 54・55）。Codex HDEでオフロードするとMXF/HDEとして約40%小さくなり、デコード時はオリジナルとビット単位で同一。","Mini LF(2019)부터 ProRes도 MXF로 래핑해 소리·영상·메타를 한 파일로 관리.":"Mini LF（2019年）以降はProResもMXFでラッピングし、音声・映像・メタデータを1ファイルで管理。","ARRI 신규 코덱. ARRIRAW보다 작고 ProRes보다 유연한 중간 지점. ARRI 공식 샘플 페이지 기준 ALEXA 35 Xtreme에서만 기록.":"ARRIの新コーデック。ARRIRAWより小さく、ProResより柔軟な中間的存在。ARRI公式サンプルページによれば、記録できるのはALEXA 35 Xtremeのみ。","ALEXA 35 Xtreme 전용":"ALEXA 35 Xtreme専用","후지필름 첫 시네마 카메라. MXF와 MOV 모두 기록, 프록시는 H.264 또는 ProRes Proxy. 3D LUT 16개 저장.":"富士フイルム初のシネマカメラ。MXFとMOVの両方で記録でき、プロキシはH.264またはProRes Proxy。3D LUTを16個保存可能。","DNxHD(HD 전용) / DNxHR LB·SQ·HQ·HQX·444":"DNxHD（HD専用） / DNxHR LB·SQ·HQ·HQX·444","8/10/12-bit · 해상도 독립(DNxHR)":"8/10/12-bit · 解像度非依存（DNxHR）","Avid Media Composer 네이티브. 방송국 인제스트·오프라인 편집 표준. MOV에도 담길 수 있습니다.":"Avid Media Composerのネイティブコーデック。放送局のインジェスト・オフライン編集の標準。MOVにも格納できます。","ISO BMFF의 원형. 타임코드 트랙·다중 오디오·ProRes 같은 전문 코덱을 담기 좋아 포스트 프로덕션의 사실상 표준입니다.":"ISO BMFFの原型。タイムコードトラック・マルチオーディオ・ProResなどのプロ用コーデックを格納しやすく、ポスプロの事実上の標準です。","iPhone 고효율 / 가장 호환성 높음":"iPhone 高効率 / 互換性優先","H.265 HEVC (기본) / H.264":"H.265 HEVC（デフォルト） / H.264","8/10-bit · Dolby Vision HDR(HLG 기반) · 최대 4K120":"8/10-bit · Dolby Vision HDR（HLGベース） · 最大4K120","iOS 11부터 HEVC가 기본. HDR을 켜면 Dolby Vision 10-bit. 4K120 Dolby Vision은 iPhone 16 Pro부터.":"iOS 11からHEVCがデフォルト。HDRをオンにするとDolby Vision 10-bit。4K120 Dolby VisionはiPhone 16 Pro以降。","HEVC 또는 ProRes":"HEVCまたはProRes","Log 촬영은 HEVC 또는 ProRes로 저장. iPhone 17 Pro부터 Apple Log 2.":"Log撮影はHEVCまたはProResで保存。iPhone 17 Pro以降はApple Log 2。","10-bit 4:2:2 · All-Intra · 4K30 약 6GB/분":"10-bit 4:2:2 · All-Intra · 4K30で約6GB/分","USB-C 외부 SSD 직접 기록(15 Pro~). 128GB 모델은 1080p로 제한.":"USB-C外部SSDへ直接記録（15 Pro以降）。128GBモデルは1080pに制限。","12-bit 베이어 RAW":"12-bit ベイヤーRAW","스마트폰 최초의 ProRes RAW. Genlock 지원으로 멀티캠 동기화, Final Cut Camera 2.0에서 오픈게이트·Log 2 사용.":"スマートフォン初のProRes RAW。Genlock対応でマルチカム同期が可能。Final Cut Camera 2.0でオープンゲート・Log 2を使用可能。","공간 비디오 (Spatial Video)":"空間ビデオ（Spatial Video）","좌·우 2시점 스테레오":"左右2視点のステレオ","Apple Vision Pro에서 3D로 재생. 베이스 레이어는 일반 HEVC라 2D로도 재생됩니다.":"Apple Vision Proで3D再生。ベースレイヤーは通常のHEVCのため、2Dでも再生できます。","iPhone 15 Pro, iPhone 16·17 시리즈, Apple Vision Pro":"iPhone 15 Pro, iPhone 16·17シリーズ, Apple Vision Pro","시네마틱 모드 · Live Photo":"シネマティックモード · Live Photo","HEVC + 깊이 메타 / HEVC":"HEVC＋深度メタデータ / HEVC","시네마틱: 최대 4K30 Dolby Vision":"シネマティック：最大4K30 Dolby Vision","시네마틱 모드는 촬영 후 초점·심도 수정 가능(깊이 맵 포함). Live Photo는 .HEIC 사진 + 약 3초 .MOV 한 쌍.":"シネマティックモードは撮影後にピント・被写界深度を変更可能（深度マップを含む）。Live Photoは.HEIC写真＋約3秒の.MOVのペア。","iPhone 13 이후(시네마틱), iPhone 6s 이후(Live Photo)":"iPhone 13以降（シネマティック）, iPhone 6s以降（Live Photo）","DJI Cine 드론 ProRes":"DJI Cineドローン ProRes","Cine 모델 전용 SSD에 ProRes 기록. 상업 공중촬영 표준. Mavic 4 Pro는 ProRes 미지원(MP4 전용).":"Cineモデル専用SSDにProResを記録。商業空撮の標準。Mavic 4 ProはProRes非対応（MP4のみ）。","DJI Zenmuse X9 계열":"DJI Zenmuse X9系","12-bit RAW · 최대 8K":"12-bit RAW · 最大8K","Ronin 4D 공식 사양: ProRes RAW HQ/RAW, ProRes 4444 XQ, 422 HQ/LT, H.264(4:2:0 10-bit). PROSSD·CFexpress·USB-C SSD 기록. Inspire 3는 같은 X9 센서에 CinemaDNG도 지원.":"Ronin 4D公式仕様：ProRes RAW HQ/RAW、ProRes 4444 XQ、422 HQ/LT、H.264（4:2:0 10-bit）。PROSSD・CFexpress・USB-C SSDに記録。Inspire 3は同じX9センサーでCinemaDNGにも対応。","내부 ProRes RAW는 CFexpress Type B에만 기록(SD 불가). HDMI로 Atomos(ProRes RAW)·Blackmagic(BRAW) 외부 RAW 기록도 지원.":"内部ProRes RAWはCFexpress Type Bのみに記録（SD不可）。HDMI経由でAtomos（ProRes RAW）・Blackmagic（BRAW）への外部RAW収録にも対応。","X-H2S부터 내부 ProRes와 프록시 동시 기록. RAW는 HDMI로 Atomos(ProRes RAW)·Blackmagic(BRAW).":"X-H2S以降は内部ProResとプロキシを同時記録。RAWはHDMI経由でAtomos（ProRes RAW）・Blackmagic（BRAW）へ。","Canon DSLR (구형 EOS)":"Canon DSLR（旧型EOS）","DSLR 동영상 시대를 연 포맷. 5D Mark IV·1D X Mark II의 4K는 MJPEG라 용량이 매우 큽니다.":"DSLR動画の時代を切り開いたフォーマット。5D Mark IV・1D X Mark IIの4KはMJPEGのため、容量が非常に大きくなります。","ARRI ProRes (구형 Alexa)":"ARRI ProRes（旧型Alexa）","Alexa가 ProRes를 영화 촬영 표준으로 만든 계기. 바로 편집 가능한 데일리.":"AlexaがProResを映画撮影の標準にしたきっかけ。そのまま編集できるデイリー素材。","10/12-bit · 최대 120fps(ProRes)":"10/12-bit · 最大120fps（ProRes）","R3D 대신 바로 편집할 포맷. RED 공식 사양: V-Raptor [X]는 4444 XQ~422 LT 전용 기록. ProRes 클립도 .RDM/.RDC 폴더 구조로 저장.":"R3Dの代わりにすぐ編集できるフォーマット。RED公式仕様：V-Raptor [X]のProRes記録は4444 XQ～422 LTのみ。ProResクリップも.RDM/.RDCフォルダ構造で保存。","X-OCN 대신 바로 편집할 포맷이 필요할 때.":"X-OCNの代わりに、すぐ編集できるフォーマットが必要なときに。","BRAW 대신 즉시 편집용. PYXIS·URSA Cine 계열은 BRAW + H.264 프록시 중심이니 기종별 확인.":"BRAWの代わりにすぐ編集する用途。PYXIS・URSA Cine系はBRAW＋H.264プロキシが中心のため、機種ごとに要確認。","보급형 시네마 박스캠. RAW는 별도 포맷(ZRAW 등).":"普及価格帯のシネマボックスカメラ。RAWは別フォーマット（ZRAWなど）。","외부 레코더 ProRes RAW":"外部レコーダー ProRes RAW","12-bit 베이어 RAW (HDMI·SDI RAW 입력)":"12-bit ベイヤーRAW（HDMI・SDI RAW入力）","카메라의 RAW 출력을 레코더가 ProRes RAW로 기록. 미러리스로 RAW를 찍는 가장 흔한 방법.":"カメラのRAW出力をレコーダーがProRes RAWで記録。ミラーレスでRAW収録する最も一般的な方法。","외부 레코더 ProRes / DNxHR":"外部レコーダー ProRes / DNxHR","ProRes 422 HQ 등 · Avid DNxHR":"ProRes 422 HQ など · Avid DNxHR","8-bit 내부 기록 카메라를 10-bit 인트라 코덱으로 끌어올리거나 백업 동시 기록.":"8-bit内部記録のカメラを10-bitイントラコーデックに引き上げる、またはバックアップとして同時記録。","가장 범용적인 컨테이너. 스마트폰·액션캠·드론·미러리스 대부분의 기본값입니다. 재생 호환성은 최고지만 타임코드 트랙과 멀티 오디오는 MOV·MXF보다 제한적입니다.":"最も汎用的なコンテナ。スマートフォン・アクションカム・ドローン・ミラーレスの大半でデフォルトです。再生互換性は最高ですが、タイムコードトラックやマルチオーディオはMOV・MXFより制約があります。","스마트폰 표준 (호환성 우선)":"スマートフォン標準（互換性優先）","8-bit 4:2:0 · Long GOP · VFR(가변 프레임)":"8-bit 4:2:0 · Long GOP · VFR（可変フレームレート）","갤럭시 '고효율 동영상' OFF 시 기본. 어디서나 재생됩니다. 스마트폰 영상은 대부분 VFR이라 편집 전 CFR 변환을 권장합니다.":"Galaxyの「高効率動画」オフ時のデフォルト。どこでも再生できます。スマートフォンの映像はほとんどがVFRのため、編集前にCFRへの変換を推奨します。","Galaxy 전 기종, Google Pixel, Xiaomi, OPPO·vivo, Sony Xperia":"Galaxy全機種, Google Pixel, Xiaomi, OPPO·vivo, Sony Xperia","스마트폰 고효율 · HDR":"スマートフォン高効率 · HDR","10-bit 4:2:0 · HDR10 / HDR10+ / HLG · 최대 8K":"10-bit 4:2:0 · HDR10 / HDR10+ / HLG · 最大8K","스마트폰 Log 촬영":"スマートフォンのLog撮影","10-bit · 제조사 Log 감마":"10-bit · メーカー独自のLogガンマ","삼성 공식 안내상 Galaxy Log 영상은 HEVC로 저장됩니다. Xiaomi Mi-Log, vivo·OPPO Log도 HEVC 기반. 제조사 LUT로 Rec.709 변환.":"Samsung公式案内によると、Galaxy LogはHEVCで保存されます。Xiaomi Mi-Log、vivo・OPPOのLogもHEVCベース。メーカー提供のLUTでRec.709に変換。","삼성이 개발한 오픈소스 전문가용 코덱. 같은 화질에서 약 10% 더 효율적이고 재인코딩 열화가 적습니다. APV로 Log 촬영 가능, 외부 저장장치 직접 기록, 기기 내 APV→HEVC 변환 메뉴 제공. FFmpeg 호환. ※ 저장 컨테이너는 삼성 문서에 명시되지 않음.":"Samsungが開発したオープンソースのプロ向けコーデック。同画質で約10%効率が高く、再エンコードによる劣化が少ないのが特長です。APVでのLog撮影、外部ストレージへの直接記録に対応し、本体内でのAPV→HEVC変換メニューも備えます。FFmpeg対応。※記録コンテナはSamsungの資料に明記されていません。","H.265 (파일명 GX…) / H.264 (파일명 GH…)":"H.265（ファイル名 GX…） / H.264（ファイル名 GH…）","8/10-bit · 최대 5.3K · GP-Log · HLG":"8/10-bit · 最大5.3K · GP-Log · HLG","GPMF로 GPS·자이로·가속도 메타 내장 → Gyroflow 후보정 가능. 긴 영상은 GX01, GX02…로 챕터 분할. .LRV(프록시)와 .THM(썸네일)이 함께 생성됩니다.":"GPMFにGPS・ジャイロ・加速度のメタデータを内蔵 → Gyroflowで後処理スタビライズが可能。長時間の映像はGX01、GX02…とチャプター分割。.LRV（プロキシ）と.THM（サムネイル）も同時に生成されます。","HERO 9~13 Black, HERO(2024), HERO11 Mini, MAX2(단렌즈 모드)":"HERO 9～13 Black, HERO（2024）, HERO11 Mini, MAX2（シングルレンズモード）","H.265 (일부 구형 H.264 병행)":"H.265（一部の旧機種はH.264も併用）","10-bit D-Log M · HLG · 최대 8K(Action 6) · 최대 120~130Mbps":"10-bit D-Log M · HLG · 最大8K（Action 6） · 最大120～130Mbps","DJI 공식 비교표 기준 최신 기종은 MP4(HEVC). Action 6은 8K(16:9) 지원. .LRF 프록시 동시 생성, 자이로 메타 내장.":"DJI公式比較表によると、最新機種はMP4（HEVC）。Action 6は8K（16:9）に対応。.LRFプロキシを同時生成し、ジャイロメタデータを内蔵。","Insta360 단렌즈 액션캠":"Insta360 シングルレンズ・アクションカム","8/10-bit · I-Log · 최대 8K30 · 최대 180Mbps(Ace Pro 2)":"8/10-bit · I-Log · 最大8K30 · 最大180Mbps（Ace Pro 2）","GO Ultra·GO 3S·GO 3는 공식 매뉴얼상 모든 모드가 MP4이고, 일부 모드에서 미리보기용 .LRV를 함께 만듭니다.":"GO Ultra·GO 3S·GO 3は公式マニュアル上すべてのモードでMP4となり、一部のモードではプレビュー用の.LRVも生成します。","DJI 포켓 짐벌캠":"DJI ポケットジンバルカメラ","10-bit · D-Log M / HLG · 1인치 센서 · 4K":"10-bit · D-Log M / HLG · 1インチセンサー · 4K","1인치 센서 포켓 짐벌의 표준 포맷. .LRF 프록시 동시 생성. 브이로그부터 상업 B캠까지. ※ Pocket 4 계열 코덱 세부는 공식 사양표 확인 권장.":"1インチセンサー搭載ポケットジンバルの標準フォーマット。.LRFプロキシを同時生成。Vlogから商業案件のBカメまで。※Pocket 4系のコーデック詳細は公式仕様表での確認を推奨。","Insta360 Luna 짐벌캠":"Insta360 Luna ジンバルカメラ","10-bit · I-Log · Dolby Vision · 8K30 / 4K120 · 최대 120Mbps":"10-bit · I-Log · Dolby Vision · 8K30 / 4K120 · 最大120Mbps","360° 스티칭 완료본":"360° スティッチング済み素材","2:1 Equirectangular · 구형(Spherical) 메타데이터":"2:1 Equirectangular · 球面（Spherical）メタデータ","카메라 내부 스티칭 또는 앱 내보내기 결과. YouTube·Meta에 바로 올라가는 범용 360 포맷. 5.7K 이상은 HEVC 권장. DJI Osmo 360·Avata 360의 일반(단렌즈) 영상도 MP4(HEVC).":"カメラ内スティッチングまたはアプリからの書き出し結果。YouTube・Metaにそのままアップロードできる汎用360フォーマット。5.7K以上はHEVC推奨。DJI Osmo 360・Avata 360の通常（シングルレンズ）映像もMP4（HEVC）。","Ricoh THETA X·Z1, Insta360 X3~X5(내보내기), Kandao QooCam 3 Ultra, DJI Osmo 360·Avata 360(일반 영상)":"Ricoh THETA X·Z1, Insta360 X3～X5（書き出し）, Kandao QooCam 3 Ultra, DJI Osmo 360·Avata 360（通常映像）","프로 VR 리그 (렌즈별 원본)":"プロ用VRリグ（レンズごとのオリジナル）","렌즈별 개별 파일 · 8K~12K · 3D 가능":"レンズごとの個別ファイル · 8K～12K · 3D対応","렌즈마다 MP4를 따로 기록한 뒤 전용 스티처나 Mistika VR로 합성. Canon 듀얼 피쉬아이 렌즈는 한 파일에 좌·우 원형 이미지가 나란히 기록됩니다.":"レンズごとにMP4を個別に記録し、専用スティッチャーやMistika VRで合成。Canonのデュアルフィッシュアイレンズは、1ファイルに左右の円周魚眼像が並んで記録されます。","Insta360 Pro 2·Titan, Kandao Obsidian, Canon RF 듀얼 피쉬아이(EOS R5·R5 C·R7)":"Insta360 Pro 2·Titan, Kandao Obsidian, Canon RF デュアルフィッシュアイ（EOS R5·R5 C·R7）","최대 6K60 · H.264 ALL-I 1200Mbps · H.265 180Mbps · H.264 90Mbps":"最大6K60 · H.264 ALL-I 1200Mbps · H.265 180Mbps · H.264 90Mbps","공식 사양상 동영상은 MP4 전용이며 ProRes는 지원하지 않습니다. H.264 AL ます。","DJI Inspire 3(X9), Inspire 2(X5S·X7), Sigma fp·fp L, Blackmagic 구형(BMCC 2.5K, Pocket 1세대, URSA Mini 4.6K, Micro Cinema), Kinefinity":"DJI Inspire 3（X9）, Inspire 2（X5S·X7）, Sigma fp·fp L, Blackmagic 旧型（BMCC 2.5K, Pocket 初代, URSA Mini 4.6K, Micro Cinema）, Kinefinity","REDCODE RAW · RED Digital Cinema (2024년 Nikon 인수)":"REDCODE RAW · RED Digital Cinema（2024年にNikonが買収）","R3D 기록 시 .RDM(매거진) → .RDC(클립) 폴더 안에 .R3D 파일과 썸네일 .rtn이 생성됩니다(RED 공식 문서). 웨이블릿 압축 RAW라 ISO·WB·LUT가 영상에 굽히지 않고 메타데이터로 저장됩니다(IPP2 · Log3G10 · REDWideGamutRGB).":"R3D収録時は.RDM（マガジン）→ .RDC（クリップ）フォルダ内に.R3Dファイルとサムネイル.rtnが生成されます（RED公式資料）。ウェーブレット圧縮のRAWのため、ISO・WB・LUTは映像に焼き込まれず、メタデータとして保存されます（IPP2 · Log3G10 · REDWideGamutRGB）。","REDCODE RAW (DSMC3 세대)":"REDCODE RAW（DSMC3世代）","품질 프리셋 방식. RED 공식 사양: V-Raptor [X]는 8K 17:9에서 HQ~ELQ 최대 60fps, LQ·ELQ 최대 120fps. HQ는 VFX·최고 화질, ELQ는 장시간.":"品質プリセット方式。RED公式仕様：V-Raptor [X]は8K 17:9でHQ～ELQが最大60fps、LQ・ELQが最大120fps。HQはVFX・最高画質向け、ELQは長時間収録向け。","V-Raptor [X]·XL [X](글로벌 셔터), V-Raptor 8K VV·S35, V-Raptor XL, Komodo-X 6K, Komodo 6K":"V-Raptor [X]·XL [X]（グローバルシャッター）, V-Raptor 8K VV·S35, V-Raptor XL, Komodo-X 6K, Komodo 6K","REDCODE RAW (DSMC2 · 구형)":"REDCODE RAW（DSMC2 · 旧型）","REDCODE 압축률 2:1 ~ 22:1":"REDCODE 圧縮率 2:1 ～ 22:1","5:1, 8:1처럼 압축률로 화질·용량을 정하던 방식. 렌탈·아카이브 현장에서 여전히 많이 다룹니다.":"5:1、8:1のように圧縮率で画質・容量を決めていた方式。レンタルやアーカイブの現場では今もよく扱います。","Log3G10 고정 · REDWideGamutRGB · 최대 6K/59.94p":"Log3G10固定 · REDWideGamutRGB · 最大6K/59.94p","Nikon 미러리스에 들어간 R3D. 톤 모드 선택 없이 Log3G10 고정이며 RED 파이프라인 그대로 현상.":"Nikonのミラーレスに搭載されたR3D。トーンモードの選択はなくLog3G10固定で、REDのパイプラインでそのまま現像。","8-bit 4:2:0 · 최대 1080p60 28Mbps · AC-3 / LPCM":"8-bit 4:2:0 · 最大1080p60 28Mbps · AC-3 / LPCM","카메라 안에서는 PRIVATE/AVCHD/BDMV/STREAM/*.MTS, PC·블루레이 복사본은 .M2TS. 폴더 구조째 가져와야 메타가 유지됩니다. 4K 이후 XAVC S·MP4로 대체.":"カメラ内ではPRIVATE/AVCHD/BDMV/STREAM/*.MTS、PC・ブルーレイへのコピーは.M2TS。フォルダ構造ごと取り込まないとメタデータが失われます。4K以降はXAVC S・MP4に置き換わりました。","DVD 캠코더":"DVDカムコーダー","8cm DVD 디스크에 직접 기록. VIDEO_TS 폴더 구조.":"8cm DVDディスクに直接記録。VIDEO_TSフォルダ構造。","Sony DCR-DVD, Hitachi 2（444 UQプロファイルは4:4:4）· イントラフレーム · FHD30 422 HQで約1.5GB/分（サムスン公式）","Galaxy S26 Ultra (Android 16 이상) — APV 첫 탑재 스마트폰, 422 HQ·422 LQ 지원":"Galaxy S26 Ultra（Android 16以降）— APVを初搭載したスマートフォン、422 HQ・422 LQに対応","422 HQ / SQ / LQ, 444 UQ 프로파일(Galaxy S26 Ultra는 422 HQ·LQ 지원). 같은 화질에서 약 10% 효율 개선, 재인코딩 열화 최소. FFmpeg 8.0 이상에서 재생.":"422 HQ / SQ / LQ、444 UQの各プロファイル（Galaxy S26 Ultraは422 HQ・LQに対応）。同画質で約10%の効率向上、再エンコードによる劣化を最小化。FFmpeg 8.0以降で再生可能。","Insta360의 1인치 센서 포켓 짐벌캠. MP4(H.265) 최대 8K30·4K120, 10-bit I-Log. Luna Pro는 단일 렌즈(최대 4배 줌), Luna Ultra는 60mm 상당 망원 카메라를 더한 듀얼 렌즈.":"Insta360の1インチセンサー搭載ポケットジンバルカメラ。MP4（H.265）で最大8K30・4K120、10-bit I-Log。Luna Proはシングルレンズ（最大4倍ズーム）、Luna Ultraは60mm相当の望遠カメラを加えたデュアルレンズ。","ProRes 4444 XQ~422 LT · ARRIRAW 2.8K(유료 라이선스)":"ProRes 4444 XQ～422 LT · ARRIRAW 2.8K（有償ライセンス）","ARRIRAW · ProRes · DNxHD(XT만)":"ARRIRAW · ProRes · DNxHD（XTのみ）","ARRIRAW (Codex 레코더)":"ARRIRAW（Codexレコーダー）","DJI 앱 미리보기 전용. 편집·CG·VFX·DI에 쓰이는 정보 없음.":"DJIアプリのプレビュー専用。編集・CG・VFX・DIで使う情報なし。","프레임별 GPS·고도·카메라 설정. VFX 카메라 트래킹·매치무브와 노출 매칭에 사용.":"フレームごとのGPS・高度・カメラ設定。VFXのカメラトラッキング・マッチムーブや露出マッチングに使用。","타임코드·렌즈·LUT·자이로 정보. 컨폼·DI·VFX·손떨림 보정에 필요.":"タイムコード・レンズ・LUT・ジャイロ情報。コンフォーム・DI・VFX・手ブレ補正に必要。","보조 파일이 아닌 사진 원본. HDRI 등 VFX 레퍼런스 소스로 쓰일 수 있습니다.":"サイドカーファイルではなく写真のオリジナル。HDRIなどVFXのリファレンス素材として使われることがあります。"}},"zh":{"ui":{"title":"摄影原始素材格式词典","titlePage":"{p} · 摄影原始素材格式词典","aria.nav":"页面","brand":"格式词典","tab.dict":"扩展名","tab.dict.s":"扩展名","tab.codecs":"编码词典","tab.codecs.s":"编码","tab.models":"品牌","tab.models.s":"品牌","tab.logs":"Log 曲线","tab.logs.s":"Log","tab.sidecar":"附属文件·DIT","tab.sidecar.s":"DIT","lang.label":"语言","aria.cats":"摄影机分类","aria.rail":"扩展名快速跳转","hero.asof":"数据截至 {d} · 官方资料核实版","hero.only":"仅收录数字摄影原始素材","hero.title":"摄影原始素材<br><em>格式词典<\/em>","hero.credit":"Curated by","hero.creditTitle":"AlterPictures","hero.lede":"哪台摄影机会生成什么文件、这些文件该怎么处理，都整理在这里。","stat.ext":"片场常见扩展名","stat.formats":"编码 · 规格组合","stat.cameras":"从 ARRI · RED 到智能手机","stat.verified":"经厂商官方资料核实","chip.all":"全部","short.all":"全部","sho er · 位深 · 代表机型和核实状态。选择摄影机分类即只显示相应扩展名，点按扩展名即可直接跳转到该格式。","aria.mcats":"摄影机类别","aria.brands":"跳转到品牌","hero.lede2":"从 ARRI·RED 电影机，到单反·无反、无人机、运动相机、云台相机、360°、智能手机、广播摄像机。<br>记录格式、编码、Log 曲线和附属文件，均以厂商官方资料为准整理。","ov.h":"概述","ov.p":"摄影机生成的每个文件，都可以从这四个方面来解读。","ov.fmt.h":"记录格式","ov.fmt.p":"在机身菜单里选择的录制方式名称，是编码、码率、封装格式的统称。XAVC S = H.264 + MP4，XF-AVC = H.264 + MXF。","ov.codec.h":"编码","ov.codec.p":"真正压缩画面的方式，决定画质、文件大小和剪辑负载。H.264、HEVC、ProRes、Blackmagic RAW、REDCODE。","ov.cont.h":"封装格式","ov.cont.p":"把视频、音频、时间码、元数据装进同一个文件的“盒子”。MP4、QuickTime（MOV）、MXF、MPEG-TS。","ov.ext.h":"扩展名","ov.ext.p":"文件名末尾的标签。能大致看出封装格式，却看不出里面的编码——同样是 .MOV，可能是 H.264，也可能是 ProRes。"},"data":{"시네마":"电影机","DSLR·미러리스":"单反·无反","드론":"无人机","액션캠":"运动相机","짐벌캠":"云台相机","스마트폰":"智能手机","방송·캠코더":"广播·摄像机","레거시 디지털":"早期数字格式","외부 레코더":"外部记录仪","웹 확인":"官方核实","업계 표준":"行业标准","확인 필요":"待核实","방송·시네마 업계 표준 컨테이너. UMID·타임코드·릴네임 등 메타데이터가 풍부하고 Avid 워크플로우와 바로 연결됩니다. OP1a는 영상+음성 한 파일, OP-Atom은 트랙별 개별 파일(Avid·P2).":"广播·电影行业的标准封装格式。UMID·时间码·卷名等元数据丰富，可直接接入 Avid 工作流。OP1a 为音视频合一的单文件，OP-Atom 为按轨道拆分的独立文件（Avid·P2）。","소니 시네마라인·방송 캠코더 표준. 방송사 납품 규격으로도 널리 쓰입니다.":"Sony Cinema Line·广播摄像机的标准格式，也广泛用作电视台交付规格。","10-bit 4:2:2 · 최대 8.6K(8K DCI 30p)":"10-bit 4:2:2 · 最高 8.6K（8K DCI 30p）","X-OCN XT / ST / LT (RAW 계열)":"X-OCN XT / ST / LT（RAW 类）","16-bit 리니어 · 베이어 · S-Gamut3":"16-bit 线性 · Bayer · S-Gamut3","소니 하이엔드 RAW. ProRes급 용량에 RAW급 계조. OP1a MXF로 래핑. Venice 2는 XT·ST·LT 내부 기록, Burano는 X-OCN LT, Venice 1은 AXS-R7 레코더.":"Sony 高端 RAW。ProRes 级的体积，RAW 级的层次。以 OP1a MXF 封装。Venice 2 可机内记录 XT·ST·LT，Burano 为 X-OCN LT，Venice 1 需搭配 AXS-R7 记录仪。","오랫동안 방송사 납품 표준. 지금도 뉴스·중계 송출 규격으로 쓰입니다.":"长期以来的电视台交付标准，至今仍用作新闻·转播的播出规格。","PDW-700·F800(광디스크), PMW-400·500, PXW-X400, PXW-Z280(호환 모드)":"PDW-700·F800（光盘）, PMW-400·500, PXW-X400, PXW-Z280（兼容模式）","시네마 EOS의 MXF 코덱. C50은 XF-AVC(MXF)와 XF-AVC S·XF-HEVC S(MP4)를 모두 지원하며 메인 포맷에 따라 프록시도 선택.":"Cinema EOS 的 MXF 编码。C50 同时支持 XF-AVC（MXF）和 XF-AVC S·XF-HEVC S（MP4），代理文件也随主格式选择。","Canon XF Codec (구형)":"Canon XF Codec（旧款）","XDCAM HD422와 같은 계열의 방송 규격.":"与 XDCAM HD422 同系列的广播规格。","XF300·XF305, EOS C300(1세대)":"XF300·XF305, EOS C300（初代）","P2 카드 기반 방송·시네마 포맷. CONTENTS 폴더 구조에 영상·음성 별도 MXF(OP-Atom). 구형 DVCPRO HD도 같은 구조.":"基于 P2 卡的广播·电影格式。CONTENTS 文件夹结构中，视频与音频分别为独立的 MXF（OP-Atom）。旧款 DVCPRO HD 结构相同。","VariCam LT·35·Pure, AJ-PX·AJ-HPX 계열 P2 캠코더":"VariCam LT·35·Pure, AJ-PX·AJ-HPX 系列 P2 摄像机","ARRIRAW (비압축 베이어 RAW)":"ARRIRAW（无压缩 Bayer RAW）","12/13-bit Log · LogC3 / LogC4 · AWG3 / AWG4 · Alexa 265는 6560×3100":"12/13-bit Log · LogC3 / LogC4 · AWG3 / AWG4 · Alexa 265 为 6560×3100","ARRI 최고 화질 원본. 메타데이터가 풍부한 MXF 컨테이너(SMPTE RDD 54·55). Codex HDE로 오프로드하면 MXF/HDE로 약 40% 작아지고 디코딩 시 원본과 비트 단위 동일.":"ARRI 最高画质的原始素材。元数据丰富的 MXF 封装（SMPTE RDD 54·55）。用 Codex HDE 卸载后，MXF/HDE 体积约减少 40%，解码后与原始文件逐位一致。","Mini LF(2019)부터 ProRes도 MXF로 래핑해 소리·영상·메타를 한 파일로 관리.":"自 Mini LF（2019）起，ProRes 也以 MXF 封装，声音·画面·元数据在一个文件里统一管理。","ARRI 신규 코덱. ARRIRAW보다 작고 ProRes보다 유연한 중간 지점. ARRI 공식 샘플 페이지 기준 ALEXA 35 Xtreme에서만 기록.":"ARRI 新编码。比 ARRIRAW 小、比 ProRes 灵活，介于两者之间。据 ARRI 官方样片页面，仅 ALEXA 35 Xtreme 可记录。","ALEXA 35 Xtreme 전용":"ALEXA 35 Xtreme 专用","후지필름 첫 시네마 카메라. MXF와 MOV 모두 기록, 프록시는 H.264 또는 ProRes Proxy. 3D LUT 16개 저장.":"Fujifilm 首款电影机。MXF 与 MOV 均可记录，代理为 H.264 或 ProRes Proxy。可存储 16 个 3D LUT。","DNxHD(HD 전용) / DNxHR LB·SQ·HQ·HQX·444":"DNxHD（仅限 HD） / DNxHR LB·SQ·HQ·HQX·444","8/10/12-bit · 해상도 독립(DNxHR)":"8/10/12-bit · 分辨率无关（DNxHR）","Avid Media Composer 네이티브. 방송국 인제스트·오프라인 편집 표준. MOV에도 담길 수 있습니다.":"Avid Media Composer 原生编码。电视台收录与离线剪辑的标准。也可封装在 MOV 中。","ISO BMFF의 원형. 타임코드 트랙·다중 오디오·ProRes 같은 전문 코덱을 담기 좋아 포스트 프로덕션의 사실상 표준입니다.":"ISO BMFF 的原型。便于承载时间码轨、多轨音频及 ProRes 等专业编码，是后期制作事实上的标准。","iPhone 고효율 / 가장 호환성 높음":"iPhone 高效 / 兼容性最佳","H.265 HEVC (기본) / H.264":"H.265 HEVC（默认） / H.264","8/10-bit · Dolby Vision HDR(HLG 기반) · 최대 4K120":"8/10-bit · Dolby Vision HDR（基于 HLG） · 最高 4K120","iOS 11부터 HEVC가 기본. HDR을 켜면 Dolby Vision 10-bit. 4K120 Dolby Vision은 iPhone 16 Pro부터.":"自 iOS 11 起默认 HEVC。开启 HDR 时为 Dolby Vision 10-bit。4K120 Dolby Vision 从 iPhone 16 Pro 开始支持。","HEVC 또는 ProRes":"HEVC 或 ProRes","Log 촬영은 HEVC 또는 ProRes로 저장. iPhone 17 Pro부터 Apple Log 2.":"Log 拍摄以 HEVC 或 ProRes 保存。iPhone 17 Pro 起支持 Apple Log 2。","10-bit 4:2:2 · All-Intra · 4K30 약 6GB/분":"10-bit 4:2:2 · All-Intra · 4K30 约 6GB/分钟","USB-C 외부 SSD 직접 기록(15 Pro~). 128GB 모델은 1080p로 제한.":"可通过 USB-C 直录外接 SSD（15 Pro 起）。128GB 机型限 1080p。","12-bit 베이어 RAW":"12-bit Bayer RAW","스마트폰 최초의 ProRes RAW. Genlock 지원으로 멀티캠 동기화, Final Cut Camera 2.0에서 오픈게이트·Log 2 사용.":"首款支持 ProRes RAW 的智能手机。支持 Genlock，可多机同步；在 Final Cut Camera 2.0 中可使用 Open Gate 和 Log 2。","공간 비디오 (Spatial Video)":"空间视频（Spatial Video）","좌·우 2시점 스테레오":"左·右双视角立体","Apple Vision Pro에서 3D로 재생. 베이스 레이어는 일반 HEVC라 2D로도 재생됩니다.":"在 Apple Vision Pro 上以 3D 播放。基础层是普通 HEVC，也能以 2D 播放。","iPhone 15 Pro, iPhone 16·17 시리즈, Apple Vision Pro":"iPhone 15 Pro, iPhone 16·17 系列, Apple Vision Pro","시네마틱 모드 · Live Photo":"电影效果模式 · 实况照片（Live Photo）","HEVC + 깊이 메타 / HEVC":"HEVC + 深度元数据 / HEVC","시네마틱: 최대 4K30 Dolby Vision":"电影效果模式：最高 4K30 Dolby Vision","시네마틱 모드는 촬영 후 초점·심도 수정 가능(깊이 맵 포함). Live Photo는 .HEIC 사진 + 약 3초 .MOV 한 쌍.":"电影效果模式可在拍摄后调整焦点和景深（含深度图）。实况照片由 .HEIC 照片 + 约 3 秒的 .MOV 组成一对。","iPhone 13 이후(시네마틱), iPhone 6s 이후(Live Photo)":"iPhone 13 及以后（电影效果模式）, iPhone 6s 及以后（实况照片）","DJI Cine 드론 ProRes":"DJI Cine 无人机 ProRes","Cine 모델 전용 SSD에 ProRes 기록. 상업 공중촬영 표준. Mavic 4 Pro는 ProRes 미지원(MP4 전용).":"Cine 机型专用 SSD 记录 ProRes，是商业航拍的标准。Mavic 4 Pro 不支持 ProRes（仅 MP4）。","DJI Zenmuse X9 계열":"DJI Zenmuse X9 系列","12-bit RAW · 최대 8K":"12-bit RAW · 最高 8K","Ronin 4D 공식 사양: ProRes RAW HQ/RAW, ProRes 4444 XQ, 422 HQ/LT, H.264(4:2:0 10-bit). PROSSD·CFexpress·USB-C SSD 기록. Inspire 3는 같은 X9 센서에 CinemaDNG도 지원.":"Ronin 4D 官方规格：ProRes RAW HQ/RAW、ProRes 4444 XQ、422 HQ/LT、H.264（4:2:0 10-bit）。可记录到 PROSSD·CFexpress·USB-C SSD。Inspire 3 使用同一 X9 传感器，还支持 CinemaDNG。","내부 ProRes RAW는 CFexpress Type B에만 기록(SD 불가). HDMI로 Atomos(ProRes RAW)·Blackmagic(BRAW) 외부 RAW 기록도 지원.":"机内 ProRes RAW 只能记录到 CFexpress Type B（不支持 SD）。也支持通过 HDMI 外录 RAW 到 Atomos（ProRes RAW）·Blackmagic（BRAW）。","X-H2S부터 내부 ProRes와 프록시 동시 기록. RAW는 HDMI로 Atomos(ProRes RAW)·Blackmagic(BRAW).":"自 X-H2S 起支持机内 ProRes 与代理同时记录。RAW 需通过 HDMI 外录到 Atomos（ProRes RAW）·Blackmagic（BRAW）。","Canon DSLR (구형 EOS)":"Canon 单反（旧款 EOS）","DSLR 동영상 시대를 연 포맷. 5D Mark IV·1D X Mark II의 4K는 MJPEG라 용량이 매우 큽니다.":"开启单反视频时代的格式。5D Mark IV·1D X Mark II 的 4K 为 MJPEG，文件非常大。","ARRI ProRes (구형 Alexa)":"ARRI ProRes（旧款 Alexa）","Alexa가 ProRes를 영화 촬영 표준으로 만든 계기. 바로 편집 가능한 데일리.":"正是 Alexa 让 ProRes 成为电影拍摄的标准。样片可直接进剪辑。","10/12-bit · 최대 120fps(ProRes)":"10/12-bit · 最高 120fps（ProRes）","R3D 대신 바로 편집할 포맷. RED 공식 사양: V-Raptor [X]는 4444 XQ~422 LT 전용 기록. ProRes 클립도 .RDM/.RDC 폴더 구조로 저장.":"替代 R3D、可直接剪辑的格式。RED 官方规格：V-Raptor [X] 仅支持记录 4444 XQ~422 LT。ProRes 素材同样按 .RDM/.RDC 文件夹结构存储。","X-OCN 대신 바로 편집할 포맷이 필요할 때.":"需要替代 X-OCN、可直接剪辑的格式时使用。","BRAW 대신 즉시 편집용. PYXIS·URSA Cine 계열은 BRAW + H.264 프록시 중심이니 기종별 확인.":"替代 BRAW，用于直接剪辑。PYXIS·URSA Cine 系列以 BRAW + H.264 代理为主，请按机型确认。","보급형 시네마 박스캠. RAW는 별도 포맷(ZRAW 등).":"入门级电影盒子机。RAW 为独立格式（ZRAW 等）。","외부 레코더 ProRes RAW":"外部记录仪 ProRes RAW","12-bit 베이어 RAW (HDMI·SDI RAW 입력)":"12-bit Bayer RAW（HDMI·SDI RAW 输入）","카메라의 RAW 출력을 레코더가 ProRes RAW로 기록. 미러리스로 RAW를 찍는 가장 흔한 방법.":"由记录仪把摄影机输出的 RAW 记录为 ProRes RAW。这是无反拍 RAW 最常见的方式。","외부 레코더 ProRes / DNxHR":"外部记录仪 ProRes / DNxHR","ProRes 422 HQ 등 · Avid DNxHR":"ProRes 422 HQ 等 · Avid DNxHR","8-bit 내부 기록 카메라를 10-bit 인트라 코덱으로 끌어올리거나 백업 동시 기록.":"把机内只能录 8-bit 的机器提升到 10-bit 帧内编码，或同步录制备份。","가장 범용적인 컨테이너. 스마트폰·액션캠·드론·미러리스 대부분의 기본값입니다. 재생 호환성은 최고지만 타임코드 트랙과 멀티 오디오는 MOV·MXF보다 제한적입니다.":"最通用的封装格式。智能手机·运动相机·无人机·无反大多默认使用。播放兼容性最好，但时间码轨和多轨音频的支持不如 MOV·MXF。","스마트폰 표준 (호환성 우선)":"智能手机标准（兼容优先）","8-bit 4:2:0 · Long GOP · VFR(가변 프레임)":"8-bit 4:2:0 · Long GOP · VFR（可变帧率）","갤럭시 '고효율 동영상' OFF 시 기본. 어디서나 재생됩니다. 스마트폰 영상은 대부분 VFR이라 편집 전 CFR 변환을 권장합니다.":"Galaxy 关闭“高效视频”时的默认格式，随处可播。手机视频大多为 VFR，建议剪辑前先转为 CFR。","Galaxy 전 기종, Google Pixel, Xiaomi, OPPO·vivo, Sony Xperia":"Galaxy 全系, Google Pixel, Xiaomi, OPPO·vivo, Sony Xperia","스마트폰 고효율 · HDR":"智能手机高效 · HDR","10-bit 4:2:0 · HDR10 / HDR10+ / HLG · 최대 8K":"10-bit 4:2:0 · HDR10 / HDR10+ / HLG · 最高 8K","스마트폰 Log 촬영":"智能手机 Log 拍摄","10-bit · 제조사 Log 감마":"10-bit · 厂商 Log 曲线","삼성 공식 안내상 Galaxy Log 영상은 HEVC로 저장됩니다. Xiaomi Mi-Log, vivo·OPPO Log도 HEVC 기반. 제조사 LUT로 Rec.709 변환.":"据 Samsung 官方说明，Galaxy Log 视频以 HEVC 保存。Xiaomi Mi-Log、vivo·OPPO Log 也基于 HEVC。用厂商 LUT 转换到 Rec.709。","삼성이 개발한 오픈소스 전문가용 코덱. 같은 화질에서 약 10% 더 효율적이고 재인코딩 열화가 적습니다. APV로 Log 촬영 가능, 외부 저장장치 직접 기록, 기기 내 APV→HEVC 변환 메뉴 제공. FFmpeg 호환. ※ 저장 컨테이너는 삼성 문서에 명시되지 않음.":"Samsung 开发的开源专业编码。同等画质下效率约高 10%，重编码损失小。可用 APV 拍 Log，可直录外接存储，机内提供 APV→HEVC 转换菜单。兼容 FFmpeg。※ Samsung 文档未注明封装格式。","H.265 (파일명 GX…) / H.264 (파일명 GH…)":"H.265（文件名 GX…） / H.264（文件名 GH…）","8/10-bit · 최대 5.3K · GP-Log · HLG":"8/10-bit · 最高 5.3K · GP-Log · HLG","GPMF로 GPS·자이로·가속도 메타 내장 → Gyroflow 후보정 가능. 긴 영상은 GX01, GX02…로 챕터 분할. .LRV(프록시)와 .THM(썸네일)이 함께 생성됩니다.":"通过 GPMF 内嵌 GPS·陀螺仪·加速度元数据 → 可用 Gyroflow 后期防抖。长视频按 GX01、GX02… 分段。同时生成 .LRV（代理）和 .THM（缩略图）。","HERO 9~13 Black, HERO(2024), HERO11 Mini, MAX2(단렌즈 모드)":"HERO 9~13 Black, HERO(2024), HERO11 Mini, MAX2（单镜头模式）","H.265 (일부 구형 H.264 병행)":"H.265（部分旧款兼用 H.264）","10-bit D-Log M · HLG · 최대 8K(Action 6) · 최대 120~130Mbps":"10-bit D-Log M · HLG · 最高 8K（Action 6） · 最高 120~130Mbps","DJI 공식 비교표 기준 최신 기종은 MP4(HEVC). Action 6은 8K(16:9) 지원. .LRF 프록시 동시 생성, 자이로 메타 내장.":"据 DJI 官方对比表，最新机型为 MP4（HEVC）。Action 6 支持 8K（16:9）。同时生成 .LRF 代理，内嵌陀螺仪元数据。","Insta360 단렌즈 액션캠":"Insta360 单镜头运动相机","8/10-bit · I-Log · 최대 8K30 · 최대 180Mbps(Ace Pro 2)":"8/10-bit · I-Log · 最高 8K30 · 最高 180Mbps（Ace Pro 2）","GO Ultra·GO 3S·GO 3는 공식 매뉴얼상 모든 모드가 MP4이고, 일부 모드에서 미리보기용 .LRV를 함께 만듭니다.":"据官方说明书，GO Ultra·GO 3S·GO 3 所有模式均为 MP4，部分模式会同时生成用于预览的 .LRV。","DJI 포켓 짐벌캠":"DJI 口袋云台相机","10-bit · D-Log M / HLG · 1인치 센서 · 4K":"10-bit · D-Log M / HLG · 1 英寸传感器 · 4K","1인치 센서 포켓 짐벌의 표준 포맷. .LRF 프록시 동시 생성. 브이로그부터 상업 B캠까지. ※ Pocket 4 계열 코덱 세부는 공식 사양표 확인 권장.":"1 英寸传感器口袋云台相机的标准格式。同时生成 .LRF 代理。从 Vlog 到商业项目的 B 机都能胜任。※ Pocket 4 系列的编码细节建议查阅官方规格表。","Insta360 Luna 짐벌캠":"Insta360 Luna 云台相机","10-bit · I-Log · Dolby Vision · 8K30 / 4K120 · 최대 120Mbps":"10-bit · I-Log · Dolby Vision · 8K30 / 4K12 (6912×4608, 29.97p)도 기록.":"Canon 无反与 Cinema EOS 共用的 MP4 格式，命名规则强化了时间码和元数据。R6 Mark III 还可记录 7K Open Gate MP4（6912×4608，29.97p）。","Canon EOS R 일반 동영상 (구형 규칙)":"Canon EOS R 普通视频（旧命名规则）","XF 이름이 붙기 전 세대 캐논 미러리스의 일반 MP4.":"冠以 XF 名称之前那一代 Canon 无反的普通 MP4。","EOS R6 Mark II, R3, R7, R8, R50, R10, R5(1세대)":"EOS R6 Mark II, R3, R7, R8, R50, R10, R5（初代）","H.264 (Nikon은 8-bit) / H.265":"H.264（Nikon 为 8-bit） / H.265","Nikon ZR 매뉴얼상 MP4는 H.264 8-bit·AAC 오디오의 호환용이고, 10-bit·RAW는 MOV/NEV/R3D 쪽입니다. Panasonic·Fujifilm도 고비트레이트·ALL-I·ProRes는 주로 MOV.":"据 Nikon ZR 说明书，MP4 为 H.264 8-bit·AAC 音频的兼容用途，10-bit·RAW 则走 MOV/NEV/R3D。Panasonic·Fujifilm 的高码率·ALL-I·ProRes 也主要用 MOV。","SxS 카드 기반 구형 방송 캠코더. BPAV 폴더 구조째 보관해야 메타가 유지됩니다.":"基于 SxS 卡的旧款广播摄像机。须按 BPAV 文件夹结构整体保存，元数据才能保留。","CinemaDNG (Adobe 공개 RAW · 프레임 시퀀스)":"CinemaDNG（Adobe 开放 RAW · 帧序列）","비압축 / 무손실 / 손실(3:1·4:1)":"无压缩 / 无损 / 有损（3:1·4:1）","12/14-bit 베이어":"12/14-bit Bayer","프레임당 DNG 1장 + 오디오 .wav. 오픈 규격이지만 파일 수가 많고 용량이 커서 BRAW·ProRes RAW로 대체되는 추세.":"每帧一张 DNG + 音频 .wav。虽是开放规格，但文件数量多、体积大，正逐渐被 BRAW·ProRes RAW 取代。","DJI Inspire 3(X9), Inspire 2(X5S·X7), Sigma fp·fp L, Blackmagic 구형(BMCC 2.5K, Pocket 1세대, URSA Mini 4.6K, Micro Cinema), Kinefinity":"DJI Inspire 3(X9), Inspire 2(X5S·X7), Sigma fp·fp L, Blackmagic 旧款（BMCC 2.5K, Pocket 初代, URSA Mini 4.6K, Micro Cinema）, Kinefinity","REDCODE RAW · RED Digital Cinema (2024년 Nikon 인수)":"REDCODE RAW · RED Digital Cinema（2024 年被 Nikon 收购）","R3D 기록 시 .RDM(매거진) → .RDC(클립) 폴더 안에 .R3D 파일과 썸네일 .rtn이 생성됩니다(RED 공식 문서). 웨이블릿 압축 RAW라 ISO·WB·LUT가 영상에 굽히지 않고 메타데이터로 저장됩니다(IPP2 · Log3G10 · REDWideGamutRGB).":"记录 R3D 时，会在 .RDM（存储卡）→ .RDC（片段）文件夹中生成 .R3D 文件和缩略图 .rtn（RED 官方文档）。属于小波压缩 RAW，ISO·白平衡·LUT 不会烘焙进画面，而是作为元数据保存（IPP2 · Log3G10 · REDWideGamutRGB）。","REDCODE RAW (DSMC3 세대)":"REDCODE RAW（DSMC3 代）","품질 프리셋 방식. RED 공식 사양: V-Raptor [X]는 8K 17:9에서 HQ~ELQ 최대 60fps, LQ·ELQ 최대 120fps. HQ는 VFX·최고 화질, ELQ는 장시간.":"采用画质预设。RED 官方规格：V-Raptor [X] 在 8K 17:9 下 HQ~ELQ 最高 60fps，LQ·ELQ 最高 120fps。HQ 用于 VFX 和最高画质，ELQ 用于长时间拍摄。","V-Raptor [X]·XL [   if (!animate || REDUCE()) {

  if (page === "models" && typeof mFrame === "function") { mcur = null; mFrame(); }
  if (changed) {
    $("q").value = qv[page] || ""; $("q").placeholder = PH[page]; runSearch(false);
  }
  document.title = page === "models" ? T("title") : T("titlePage", {p: document.querySelector(`#tabs [data-tab="${page}"] .f`).textContent});
}
addEventListener("hashchange", route);
// 같은 메뉴를 다시 누르면 그 페이지 맨 위로
$("tabs").addEventListener("click", e => {
  const a = e.target.closest("a[href^='#']"); if (!a) return;
  if (a.getAttribute("href").slice(1) === page) { e.preventDefault(); scrollTo({top: 0, behavior: "smooth"}); }
});

// ---------- 하단 검색: 지금 보고 있는 페이지 안에서 걸러 줌 ----------
const PH = Object.fromEntries(PAGES.map(k => [k, T("ph." + k)]));
const qv = {};
function runSearch(animate = true) {
  const raw = $("q").value, t = raw.trim().toLowerCase();
  qv[page] = raw; $("sbX").hidden = !t;
  let n = 1;
  if (page === "dict") apply(animate);
  else if (page === "models") {
    n = modelsApply(t);
  } else {
    n = 0;
    document.querySelectorAll(`#pg-${page} tbody tr`).forEach(tr => { const ok = !t || tr.textContent.toLowerCase().includes(t); tr.hidden = !ok; if (ok) n++; });
  }
  $("none").hidden = page === "dict" || n > 0;
  // 찾은 글자 표시
  clearMarks();
  lastHits = [];
  if (!t) return;
  const scope = page === "dict" ? [...document.querySelectorAll(".card")].filter(c => !c.hidden && !c.closest(".reel").hidden)
    : page === "models" ? [...document.querySelectorAll("#mg li")].filter(li => !li.hidden)
    : [...document.querySelectorAll(`#pg-${page} tbody tr`)].filter(tr => !tr.hidden);
  scope.forEach(el => markIn(el, t));
  if (page === "dict") document.querySelectorAll(".reel:not([hidden]) .reel-head").forEach(h => markIn(h, t));
  lastHits = page === "models" ? [...new Set(scope.map(li => li.closest(".mbr")))] : scope;
}
let lastHits = [];
function clearMarks() {
  const parents = new Set();
  document.querySelectorAll("mark.hit").forEach(m => { parents.add(m.parentNode); m.replaceWith(m.textContent); });
  parents.forEach(p => p.normalize());
}
function markIn(el, t) {
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {acceptNode: n => n.nodeValue.toLowerCase().includes(t) ? 1 : 2});
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    const v = n.nodeValue, lv = v.toLowerCase(), f = document.createDocumentFragment();
    let i = 0, j;
    while ((j = lv.indexOf(t, i)) > -1) { f.append(v.slice(i, j)); const m = document.createElement("mark"); m.className = "hit"; m.textContent = v.slice(j, j + t.length); f.append(m); i = j + t.length; }
    f.append(v.slice(i)); n.replaceWith(f);
  });
}
// 검색 버튼·엔터: 첫 결과 카드로 이동 + 찾은 글자와 카드 테두리 깜빡임
function showHits() {
  if (!lastHits.length) return;
  const first = lastHits[0];
  const off = tabsH() + (page === "dict" ? mini.offsetHeight : 0) + 14;
  scrollTo({top: Math.max(0, first.getBoundingClientRect().top + scrollY - off), behavior: REDUCE() ? "instant" : "smooth"});
  document.querySelectorAll("mark.hit").forEach(m => { m.classList.remove("blink"); void m.offsetWidth; m.classList.add("blink"); });
  lastHits.forEach(c => c.classList.add("hitflash"));
  clearTimeout(showHits.t); showHits.t = setTimeout(() => lastHits.forEach(c => c.classList.remove("hitflash")), 1300);
}
$("q").addEventListener("input", () => runSearch());
$("sb").addEventListener("submit", e => { e.preventDefault(); runSearch(); $("q").blur(); showHits(); });
$("sbGo").addEventListener("click", e => { if (!$("q").value.trim()) { e.preventDefault(); $("q").focus(); } });
$("sbX").addEventListener("click", () => { $("q").value = ""; runSearch(); $("q").focus(); });
// 스크롤하는 동안엔 작게, 멈추면 다시 크게 (입력 중엔 그대로)
let sbT = 0;
addEventListener("scroll", () => {
  if (document.activeElement === $("q")) return;
  $("sb").classList.add("min"); clearTimeout(sbT);
  sbT = setTimeout(() => $("sb").classList.remove("min"), 280);
}, {passive: true});

// ---------- 좌우로 밀어 페이지 넘기기 (사전 ← → DIT, 양 끝에선 그대로) ----------
function goPage(d) { const i = PAGES.indexOf(page) + d; if (i >= 0 && i < PAGES.length) location.hash = PAGES[i]; }
let sx = 0, sy = 0, st = 0, sOk = false;
addEventListener("touchstart", e => {
  if (e.touches.length !== 1) { sOk = false; return; }
  const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now();
  sOk = !e.target.closest("input, .sb, .mini, .bar");
}, {passive: true});
addEventListener("touchend", e => {
  if (!sOk) return; sOk = false;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * .6 || Date.now() - st > 2500) return;
  goPage(dx > 0 ? -1 : 1);   // 왼→오른쪽으로 밀면 왼쪽 메뉴, 오른→왼쪽이면 오른쪽 메뉴
}, {passive: true});
// 맥 트랙패드 두 손가락 좌우 스와이프
let wx = 0, wt = 0, wLock = 0;
addEventListener("wheel", e => {
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY) * 1.5) { wx = 0; return; }
  const now = Date.now(); if (now < wLock) return;
  if (now - wt > 300) wx = 0; wt = now; wx += e.deltaX;
  if (Math.abs(wx) > 140) { goPage(wx > 0 ? 1 : -1); wx = 0; wLock = now + 900; }
}, {passive: true});

// ---------- 언어 선택 ----------
$("langCode").textContent = LANGS.find(([k]) => k === LANG)?.[2] || "KO";
$("langMenu").innerHTML = LANGS.map(([k, name]) => `<li role="none"><button type="button" role="menuitemradio" aria-checked="${k === LANG}" data-lang="${k}" lang="${k === "zh" ? "zh-Hans" : k}">${name}</button></li>`).join("");
const langOpen = open => { $("langMenu").hidden = !open; $("langBtn").setAttribute("aria-expanded", open); };
$("langBtn").addEventListener("click", e => { e.stopPropagation(); langOpen($("langMenu").hidden); });
document.addEventListener("click", e => { if (!e.target.closest("#lang")) langOpen(false); });
addEventListener("keydown", e => { if (e.key === "Escape") langOpen(false); });
$("langMenu").addEventListener("click", e => {
  const b = e.target.closest("[data-lang]"); if (!b) return;
  try { localStorage.setItem("lang", b.dataset.lang); } catch (_) {}
  const u = new URL(location.href); u.searchParams.delete("lang");
  if (b.dataset.lang === LANG) return langOpen(false);
  location.replace(u.href); if (u.href === location.href) location.reload();
});

// ---------- 브랜드별 찾기: 카메라 계열 칩 + 브랜드 레일 (사전 페이지와 같은 동작) ----------
const MON = true;
const mmini = $("mmini");
let mcat = "all", mcur = null, mactive = null, mlock = null, mlockT = 0, mtick = false;
try { const s = localStorage.getItem("mcat"); if (s && (s === "all" || CATS[s])) mcat = s; } catch (_) {}
const MBY = {};
DATA.models.forEach(m => { ((MBY[m[0]] ??= {})[m[1]] ??= 0); MBY[m[0]][m[1]]++; });
const MKEYS = Object.keys(CATS).filter(k => MBY[k]);
const mcount = k => k === "all" ? DATA.models.length : Object.values(MBY[k]).reduce((a, b) => a + b, 0);
const mchipsHTML = ["all", ...MKEYS].map(k => `<button class="chip" type="button" data-k="${k}" aria-pressed="${k === mcat}" style="--cc:${k === "all" ? "var(--ink)" : `var(--c-${k})`}"><span class="dot"></span><span class="lf">${k === "all" ? T("chip.all") : CATS[k]}</span><span class="ls">${SHORT[k] || CATS[k]}</span><small>${mcount(k)}</small></button>`).join("");
$("mchips").innerHTML = $("mchips2").innerHTML = mchipsHTML;
const mtilesHTML = MKEYS.flatMap(k => Object.entries(MBY[k]).map(([b, n]) => `<a class="tile" href="#mb-${k}-${bslug(b)}" data-id="mb-${k}-${bslug(b)}" data-k="${k}" hidden>${E(b)}<sup>${n}</sup></a>`)).join("");
$("mrail").innerHTML = $("mrail2").innerHTML = mtilesHTML;
const mTiles = () => document.querySelectorAll("#mrail .tile, #mrail2 .tile");
if (!MON) { $("mbar").hidden = true; mmini.hidden = true; }
function mBars() { document.querySelectorAll("#bars i").forEach(i => { i.style.opacity = !MON || mcat === "all" || i.dataset.k === mcat ? 1 : .18; }); }
mBars();

function modelsApply(t) {
  let n = 0;
  document.querySelectorAll("#mg .mcl").forEach(cl => {
    const catOk = mcat === "all" || cl.dataset.k === mcat; let c = 0;
    cl.querySelectorAll(".mbr").forEach(br => { let b = 0;
      br.querySelectorAll("li").forEach(li => { const ok = !t || li.dataset.s.includes(t); li.hidden = !ok; if (ok) b++; });
      br.hidden = !b; c += b; });
    cl.hidden = !catOk || !c; if (!cl.hidden) n += c;
  });
  if (MON) { mcur = null; mFrame(); }
  return n;
}
function setMmini(show) {
  if (show === mmini.classList.contains("show")) return;
  mmini.classList.toggle("show", show); mmini.inert = !show;
}
function mLine() { return tabsH() + (mmini.classList.contains("show") ? mmini.offsetHeight : 0) + 24; }
function mFrame() {
  mtick = false;
  if (page !== "models" || !MON) return;
  // 큰 바 → 미니 바 전환 (사전 페이지와 같은 모션)
  const mh = tabsH() + mmini.offsetHeight, b = $("mbar").getBoundingClientRect(), railBottom = $("mrail").getBoundingClientRect().bottom;
  const p = Math.min(1, Math.max(0, (mh - b.top) / Math.max(1, b.height))), bi = $("mbar").firstElementChild;
  if (!REDUCE()) { bi.style.transform = p ? `scale(${(1 - .14 * p).toFixed(4)})` : ""; bi.style.opacity = p ? (1 - .75 * p).toFixed(3) : ""; }
  const shown = mmini.classList.contains("show");
  if (!shown && railBottom < mh) setMmini(true); else if (shown && railBottom > mh + 12) setMmini(false);
  // 지금 보고 있는 카메라 계열 → 그 계열 브랜드만 레일에 표시
  const vis = [...document.querySelectorAll("#mg .mcl")].filter(c => !c.hidden);
  const line = mLine();
  let cur = vis[0] || null;
  for (const c of vis) { if (c.getBoundingClientRect().top <= line) cur = c; else break; }
  const k = cur ? cur.dataset.k : null;
  if (k !== mcur) {
    mcur = k;
    const ids = new Set(cur ? [...cur.querySelectorAll(".mbr")].filter(x => !x.hidden).map(x => x.id) : []);
    const mini = mmini.classList.contains("show");
    animateTiles($("mrail"), ids, !mini); animateTiles($("mrail2"), ids, mini);
  }
  // 지금 보고 있는 브랜드 강조
  let act = mlock;
  if (!act && cur) {
    act = null;
    for (const br of cur.querySelectorAll(".mbr")) { if (br.hidden) continue; if (br.getBoundingClientRect().top <= line) act = br.id; else break; }
  }
  if (mlock) { const t = $(mlock).getBoundingClientRect().top; if (Math.abs(t - (tabsH() + mmini.offsetHeight + 12)) < 8) { clearTimeout(mlockT); mlockT = setTimeout(() => { mlock = null; mFrame(); }, 120); } }
  if (act !== mactive) { mactive = act; mTiles().forEach(t => t.classList.toggle("on", t.dataset.id === act)); }
}
addEventListener("scroll", () => { if (!mtick && page === "models") { mtick = true; requestAnimationFrame(mFrame); } }, {passive: true});
addEventListener("resize", () => page === "models" && mFrame());
["touchstart", "wheel", "keydown"].forEach(ev => addEventListener(ev, () => { if (mlock) { mlock = null; clearTimeout(mlockT); } }, {passive: true}));
function mGo(el, flash) {
  if (!el) return;
  const top = el.getBoundingClientRect().top + scrollY - tabsH() - mmini.offsetHeight - 12;
  scrollTo({top: Math.max(0, top), behavior: REDUCE() ? "instant" : "smooth"});
  if (flash) { el.classList.add("hitflash"); setTimeout(() => el.classList.remove("hitflash"), 1000); }
}
const onMTile = e => {
  const a = e.target.closest(".tile"); if (!a) return;
  e.preventDefault(); a.blur();
  mlock = a.dataset.id; clearTimeout(mlockT); mlockT = setTimeout(() => { mlock = null; mFrame(); }, 2500);
  mactive = null; mFrame();
  mGo($(a.dataset.id), true);
};
$("mrail").addEventListener("click", onMTile); $("mrail2").addEventListener("click", onMTile);
const onMChip = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  mcat = b.dataset.k; b.blur();
  document.querySelectorAll("#mchips .chip, #mchips2 .chip").forEach(x => x.setAttribute("aria-pressed", x.dataset.k === mcat));
  try { localStorage.setItem("mcat", mcat); } catch (_) {}
  mBars();
  runSearch(true);
  const first = [...document.querySelectorAll("#mg .mcl")].find(c => !c.hidden);
  if (first) setTimeout(() => mGo(first, false), 80);
};
$("mchips").addEventListener("click", onMChip); $("mchips2").addEventListener("click", onMChip);

apply(false);
route();
$("q").placeholder = PH[page];
spyFrame();
</script>

</html>
